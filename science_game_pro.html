<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมผจญภัยวิทยาศาสตร์สุด ⏱️🪙</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 60px 16px 16px;
        }

        /* ปุ่มกลับหน้าเมนูหลัก */
        .back-home-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            padding: 9px 13px;
            border-radius: 10px;
            background: white;
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .back-home-btn:hover {
            background: #f1f5f9;
        }

        .game-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }

        h2 {
            color: #0288d1;
            margin-top: 10px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #29b6f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            background: #0288d1;
        }

        .level-btn {
            background: #66bb6a;
        }

        .level-btn:hover {
            background: #43a047;
        }

        /* ปุ่มย้อนกลับในเกม */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #f0f0f0;
            color: #555;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #e0e0e0;
            color: #000;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            background: #e1f5fe;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 20px;
            color: #01579b;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 24px 18px;
            }

            #screen-game h2 {
                margin-top: 48px;
            }

            .back-btn {
                top: 12px;
                left: 12px;
            }

            .info-bar {
                font-size: 14px;
                padding: 9px 10px;
            }
        }
    </style>
</head>
<body>

<a href="index.html" class="back-home-btn" title="กลับหน้าเมนูหลัก">
    🏠 กลับหน้าหลัก
</a>

<div class="game-container">
    <!-- หน้าเลือกเลเวล -->
    <div id="screen-menu">
        <h2>🧪 ผจญภัยวิทยาศาสตร์</h2>
        <p>เลือกช่วงอายุและระดับความยาก:</p>
        <button class="btn level-btn" onclick="startGame(1)">🌱 ระดับง่าย (อายุ 6-8 ปี)</button>
        <button class="btn level-btn" onclick="startGame(2)" style="background: #ffa726;">⭐ ระดับปานกลาง (อายุ 9-11 ปี)</button>
        <button class="btn level-btn" onclick="startGame(3)" style="background: #ef5350;">🔥 ระดับยาก (อายุ 12-15 ปี)</button>
    </div>

    <!-- หน้าเล่นเกม -->
    <div id="screen-game" class="hidden">
        <button class="back-btn" onclick="goBackToMenu()">⬅️ หน้าหลัก</button>
        <h2>🧪 ผจญภัยวิทยาศาสตร์</h2>
        <div class="info-bar">
            <span id="timer-text">⏱️ เวลา: 10s</span>
            <span id="coin-text">🪙 เหรียญ: 0</span>
        </div>
        <p id="question" style="font-size: 18px; font-weight: bold; min-height: 50px;"></p>
        <div id="options"></div>
    </div>

    <!-- หน้าสรุปผล -->
    <div id="screen-score" class="hidden">
        <h2>🧪 ผจญภัยวิทยาศาสตร์</h2>
        <h3>🎉 จบเกมแล้ว!</h3>
        <p id="final-result" style="font-size: 18px; margin: 20px 0;"></p>
        <button class="btn" onclick="resetGame()">เล่นใหม่อีกครั้ง 🔄</button>
        <button class="btn" style="background: #78909c;" onclick="goBackToMenu()">กลับหน้าเลือกเลเวล 🏠</button>
    </div>
</div>

<!-- สคริปต์เกมหลัก -->
<script>
   const allQuestions = {
    1: [
        { q: "สัตว์ข้อใดบินได้?", options: ["ปลาทู", "นกแก้ว", "เต่า", "กบ"], answer: 1 },
        { q: "ดวงอาทิตย์ขึ้นทางทิศใด?", options: ["ทิศตะวันออก", "ทิศตะวันตก", "ทิศเหนือ", "ทิศใต้"], answer: 0 },
        { q: "น้ำแข็งคือสถานะใดของน้ำ?", options: ["แก๊ส", "ของเหลว", "ของแข็ง", "พลาสติก"], answer: 2 }
    ],
    2: [
        { q: "แก๊สใดที่มนุษย์ใช้หายใจเพื่อดำรงชีวิต?", options: ["คาร์บอนไดออกไซด์", "ออกซิเจน", "ไนโตรเจน", "ฮีเลียม"], answer: 1 },
        { q: "อวัยวะใดทำหน้าที่สูบฉีดเลือดไปทั่วร่างกาย?", options: ["สมอง", "ปอด", "หัวใจ", "ตับ"], answer: 2 },
        { q: "ดาวเคราะห์ดวงใดได้ชื่อว่าเป็น 'ดาวแดง'?", options: ["ดาวศุกร์", "ดาวอังคาร", "ดาวพฤหัสบดี", "ดาวเสาร์"], answer: 1 }
    ],
    3: [
        { q: "ออร์แกเนลล์ใดสร้าง ATP ส่วนใหญ่ให้แก่เซลล์?", options: ["ไรโบโซม", "ไมโทคอนเดรีย", "กอลจิบอดี", "ไลโซโซม"], answer: 1 },
        { q: "คลอโรฟิลล์มีบทบาทสำคัญอย่างไรในการสังเคราะห์ด้วยแสง?", options: ["ดูดซับพลังงานแสง", "ลำเลียงน้ำตาล", "สลายโปรตีน", "สร้างแร่ธาตุในดิน"], answer: 0 },
        { q: "คู่เบสของ DNA ข้อใดจับคู่กันถูกต้อง?", options: ["A-G และ C-T", "A-C และ G-T", "A-T และ C-G", "A-U และ C-G"], answer: 2 },
        { q: "โดยทั่วไป การแบ่งเซลล์แบบไมโทซิสให้ผลอย่างไร?", options: ["ได้เซลล์ลูก 2 เซลล์ที่มีจำนวนโครโมโซมเท่าเซลล์เดิม", "ได้เซลล์ลูก 4 เซลล์ที่มีโครโมโซมครึ่งหนึ่ง", "ได้เซลล์ลูก 2 เซลล์ที่ไม่มีนิวเคลียส", "ได้เซลล์ลูก 4 เซลล์ที่เหมือนกันทุกประการ"], answer: 0 },
        { q: "หน่วยทำงานพื้นฐานของไตที่ช่วยกรองเลือดเรียกว่าอะไร?", options: ["แอลวีโอลัส", "นิวรอน", "เนฟรอน", "วิลลัส"], answer: 2 },
        { q: "หลอดเลือดแดงมีหน้าที่หลักข้อใด?", options: ["นำเลือดออกจากหัวใจ", "นำเลือดเข้าสู่หัวใจ", "สร้างเม็ดเลือดแดง", "กรองของเสียออกจากเลือด"], answer: 0 },
        { q: "การคัดเลือกโดยธรรมชาติส่งผลอย่างไรต่อประชากรสิ่งมีชีวิต?", options: ["สิ่งมีชีวิตทุกตัวเปลี่ยนแปลงเหมือนกัน", "ลักษณะที่ช่วยให้อยู่รอดและสืบพันธุ์มีโอกาสพบมากขึ้น", "สิ่งมีชีวิตหยุดกลายพันธุ์", "สิ่งมีชีวิตทุกตัวมีอายุยืนเท่ากัน"], answer: 1 },
        { q: "เอนไซม์ช่วยเร่งปฏิกิริยาเคมีโดยทำสิ่งใด?", options: ["เพิ่มพลังงานกระตุ้นที่ต้องใช้", "ลดพลังงานกระตุ้นที่ต้องใช้", "เปลี่ยนผลิตภัณฑ์ให้เป็นธาตุเสมอ", "เพิ่มมวลของสารตั้งต้น"], answer: 1 },
        { q: "สารละลายที่มีค่า pH เท่ากับ 3 มีสมบัติอย่างไร?", options: ["เป็นกรด", "เป็นกลาง", "เป็นเบส", "ไม่มีไอออน"], answer: 0 },
        { q: "พันธะไอออนิกมักเกิดจากกระบวนการใด?", options: ["การใช้อิเล็กตรอนร่วมกัน", "การถ่ายโอนอิเล็กตรอนระหว่างอะตอม", "การรวมโปรตอนเข้าด้วยกัน", "การแบ่งนิวเคลียส"], answer: 1 },
        { q: "ไอโซโทปของธาตุชนิดเดียวกันมีสิ่งใดแตกต่างกัน?", options: ["จำนวนโปรตอน", "เลขอะตอม", "จำนวนนิวตรอน", "ชนิดของธาตุ"], answer: 2 },
        { q: "ตัวเร่งปฏิกิริยามีผลอย่างไรต่อปฏิกิริยาเคมี?", options: ["ทำให้ปฏิกิริยาเร็วขึ้นและถูกใช้หมดเสมอ", "ทำให้ปฏิกิริยาเร็วขึ้นโดยไม่ถูกใช้หมดในปฏิกิริยา", "ทำให้มวลสารตั้งต้นเพิ่มขึ้น", "หยุดการเกิดผลิตภัณฑ์"], answer: 1 },
        { q: "ตามกฎทรงมวล เมื่อเกิดปฏิกิริยาเคมีในระบบปิด ข้อใดถูกต้อง?", options: ["มวลรวมก่อนและหลังปฏิกิริยาเท่ากัน", "มวลรวมหลังปฏิกิริยามากกว่าเสมอ", "มวลรวมหลังปฏิกิริยาน้อยกว่าเสมอ", "มวลหายไปเมื่อเกิดแก๊ส"], answer: 0 },
        { q: "สูตรเคมีของสารประกอบโซเดียมคลอไรด์คือข้อใด?", options: ["Na₂Cl", "NaCl", "NaCl₂", "NCl"], answer: 1 },
        { q: "ปฏิกิริยาคายความร้อนมีลักษณะอย่างไร?", options: ["ดูดความร้อนจากสิ่งแวดล้อม", "ปล่อยความร้อนสู่สิ่งแวดล้อม", "ไม่มีการถ่ายโอนพลังงาน", "เปลี่ยนความร้อนเป็นมวล"], answer: 1 },
        { q: "ในความหมายทางเคมีทั่วไป การออกซิเดชันหมายถึงข้อใด?", options: ["การรับอิเล็กตรอน", "การสูญเสียอิเล็กตรอน", "การรับนิวตรอน", "การสูญเสียโปรตอน"], answer: 1 },
        { q: "วัตถุเคลื่อนที่ได้ระยะทาง 100 เมตรใน 20 วินาที อัตราเร็วเฉลี่ยเท่าใด?", options: ["2 m/s", "5 m/s", "20 m/s", "80 m/s"], answer: 1 },
        { q: "วัตถุมวล 2 kg มีความเร่ง 3 m/s² ต้องใช้แรงลัพธ์เท่าใด?", options: ["1.5 N", "5 N", "6 N", "9 N"], answer: 2 },
        { q: "ตัวต้านทาน 2 Ω และ 3 Ω ต่อแบบอนุกรม มีความต้านทานรวมเท่าใด?", options: ["1 Ω", "1.2 Ω", "5 Ω", "6 Ω"], answer: 2 },
        { q: "หน่วยวัดความถี่ในระบบ SI คือข้อใด?", options: ["จูล (J)", "เฮิรตซ์ (Hz)", "นิวตัน (N)", "วัตต์ (W)"], answer: 1 },
        { q: "การหักเหของแสงเกิดขึ้นเมื่อใด?", options: ["แสงเปลี่ยนทิศทางเมื่อผ่านตัวกลางต่างชนิด", "แสงหยุดเคลื่อนที่ในสุญญากาศ", "แสงเปลี่ยนเป็นเสียง", "แสงสะท้อนกลับจากผิวเรียบเท่านั้น"], answer: 0 },
        { q: "วัตถุมวล 2 kg อยู่สูงจากพื้น 5 m ถ้า g = 10 m/s² จะมีพลังงานศักย์โน้มถ่วงเท่าใด?", options: ["25 J", "50 J", "100 J", "200 J"], answer: 2 },
        { q: "กฎการเคลื่อนที่ข้อที่สามของนิวตันกล่าวว่าอย่างไร?", options: ["วัตถุคงสภาพการเคลื่อนที่เมื่อไม่มีแรงลัพธ์", "แรงลัพธ์เท่ากับมวลคูณความเร่ง", "ทุกแรงกิริยามีแรงปฏิกิริยาขนาดเท่ากันและทิศตรงข้าม", "พลังงานสร้างขึ้นใหม่ได้เสมอ"], answer: 2 },
        { q: "คลื่นมีอัตราเร็ว 12 m/s และความถี่ 3 Hz ความยาวคลื่นเท่าใด?", options: ["0.25 m", "4 m", "9 m", "36 m"], answer: 1 },
        { q: "สาเหตุหลักที่ทำให้เกิดฤดูกาลบนโลกคือข้อใด?", options: ["โลกอยู่ใกล้ดวงอาทิตย์ไม่เท่ากันในแต่ละวัน", "แกนโลกเอียงขณะโลกโคจรรอบดวงอาทิตย์", "ดวงจันทร์บังแสงอาทิตย์", "โลกหมุนรอบตัวเองช้าลงในฤดูหนาว"], answer: 1 },
        { q: "บริเวณที่แผ่นธรณีมหาสมุทรมุดลงใต้แผ่นธรณีอีกแผ่นเรียกว่าอะไร?", options: ["เขตมุดตัว", "สันเขากลางทวีป", "ที่ราบน้ำท่วมถึง", "แกนโลกชั้นใน"], answer: 0 },
        { q: "แสงจันทร์ที่เราเห็นส่วนใหญ่เกิดจากอะไร?", options: ["ดวงจันทร์สร้างแสงเอง", "ดวงจันทร์สะท้อนแสงจากดวงอาทิตย์", "แสงจากดาวฤกษ์รวมตัวบนดวงจันทร์", "ชั้นบรรยากาศของโลกสร้างแสงให้ดวงจันทร์"], answer: 1 },
        { q: "ปีแสงเป็นหน่วยวัดสิ่งใด?", options: ["เวลา", "ความสว่าง", "ระยะทาง", "อุณหภูมิ"], answer: 2 },
        { q: "เมื่อระดับความสูงจากพื้นโลกเพิ่มขึ้น ความกดอากาศโดยทั่วไปเป็นอย่างไร?", options: ["เพิ่มขึ้น", "ลดลง", "คงที่เสมอ", "กลายเป็นศูนย์ทันที"], answer: 1 },
        { q: "การควบแน่นในวัฏจักรน้ำคือการเปลี่ยนสถานะใด?", options: ["ของแข็งเป็นของเหลว", "ของเหลวเป็นแก๊ส", "แก๊สเป็นของเหลว", "ของเหลวเป็นของแข็ง"], answer: 2 }
    ]
};

    let currentLevel = 1;
    let currentQIndex = 0;
    let score = 0;
    let coins = 0;
    let timeLeft = 10;
    let timer;

    const menuScreen = document.getElementById("screen-menu");
    const gameScreen = document.getElementById("screen-game");
    const scoreScreen = document.getElementById("screen-score");
    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const timerText = document.getElementById("timer-text");
    const coinText = document.getElementById("coin-text");
    const finalResultEl = document.getElementById("final-result");

    function startGame(level) {
        clearInterval(timer);
        currentLevel = level;
        currentQIndex = 0;
        score = 0;
        coins = 0;
        coinText.innerText = "🪙 เหรียญ: 0";
        menuScreen.classList.add("hidden");
        scoreScreen.classList.add("hidden");
        gameScreen.classList.remove("hidden");
        loadQuestion();
    }

    function loadQuestion() {
        clearInterval(timer);
        const questions = allQuestions[currentLevel];

        if (currentQIndex < questions.length) {
            const q = questions[currentQIndex];
            questionEl.innerText = `ข้อที่ ${currentQIndex + 1}: ${q.q}`;
            optionsEl.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "btn";
                btn.onclick = () => checkAnswer(index);
                optionsEl.appendChild(btn);
            });

            timeLeft = 10;
            timerText.innerText = `⏱️ เวลา: ${timeLeft}s`;

            timer = setInterval(() => {
                timeLeft--;
                timerText.innerText = `⏱️ เวลา: ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    alert("⏰ หมดเวลา! ข้อนี้ไม่ได้คะแนนนะ");
                    nextQuestion();
                }
            }, 1000);
        } else {
            showScore();
        }
    }

    function checkAnswer(selected) {
        clearInterval(timer);
        const q = allQuestions[currentLevel][currentQIndex];

        if (selected === q.answer) {
            score++;
            const earnedCoins = 10 + (timeLeft * 2);
            coins += earnedCoins;
            alert(`✅ ถูกต้อง! รับไป ${earnedCoins} เหรียญ 🪙`);
        } else {
            alert("❌ ยังไม่ถูกต้องนะ ลองใหม่ข้อถัดไป!");
        }

        nextQuestion();
    }

    function nextQuestion() {
        currentQIndex++;
        coinText.innerText = `🪙 เหรียญ: ${coins}`;
        loadQuestion();
    }

    function showScore() {
        gameScreen.classList.add("hidden");
        scoreScreen.classList.remove("hidden");
        const totalQ = allQuestions[currentLevel].length;
        finalResultEl.innerHTML =
            `ตอบถูก: ${score} / ${totalQ} ข้อ<br>สะสมเหรียญรวม: <b>${coins} 🪙</b>`;

        // ⭐ เรียกฟังก์ชันบันทึกคะแนนลง Firebase (ใช้จำนวนเหรียญเป็นคะแนน)
        if (typeof saveScienceScore === 'function') {
            saveScienceScore(coins);
        }
    }

    function resetGame() {
        startGame(currentLevel);
    }

    function goBackToMenu() {
        clearInterval(timer);
        gameScreen.classList.add("hidden");
        scoreScreen.classList.add("hidden");
        menuScreen.classList.remove("hidden");
    }
</script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAGu__RjEy0WRI7hYDdKfai9vio8GqWoqw",
        authDomain: "skilldragonyok.firebaseapp.com",
        projectId: "skilldragonyok",
        storageBucket: "skilldragonyok.firebasestorage.app",
        messagingSenderId: "894981973450",
        appId: "1:894981973450:web:39d6f4c2170e774c1d1b33"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ⭐ ฟังก์ชันบันทึกคะแนนเกมวิทยาศาสตร์
    async function saveScienceScore(finalScore) {
        const user = firebase.auth().currentUser;
        
        if (!user) {
            console.warn("ผู้เล่นยังไม่ได้เข้าสู่ระบบ จึงไม่บันทึกคะแนน");
            return;
        }
        
        // ถ้าเล่นได้ 0 คะแนน ไม่ต้องบันทึก
        if (finalScore <= 0) return;

        const gameId = 'science'; // ID ต้องตรงกับใน index.html
        const userRef = db.collection('users').doc(user.uid);

        try {
            await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(userRef);
                if (!doc.exists) return;

                const games = doc.data().games || {};
                const cur = games[gameId] || { total: 0, best: 0, plays: 0 };

                transaction.update(userRef, {
                    totalScore: firebase.firestore.FieldValue.increment(finalScore),
                    [`games.${gameId}`]: {
                        total: (cur.total || 0) + finalScore,
                        best: Math.max(cur.best || 0, finalScore),
                        plays: (cur.plays || 0) + 1,
                        lastPlayed: new Date()
                    }
                });
            });
            console.log(`✅ บันทึกคะแนนเกม Science สำเร็จ: ${finalScore}`);
        } catch (error) {
            console.error("❌ บันทึกคะแนนล้มเหลว:", error);
        }
    }
</script>
