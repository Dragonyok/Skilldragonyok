<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Adventure - 10 Levels</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- ปุ่มกลับหน้าหลัก -->
        <a href="index.html" class="home-btn" style="text-decoration: none; display: inline-block; margin-bottom: 20px; padding: 8px 16px; background: #e43f5a; color: white; border-radius: 8px; font-weight: bold;">🏠 กลับหน้าหลัก</a>

        <h1>🤖 ผจญภัยเมืองสมองกล</h1>
        
        <!-- แผงเลือกด่าน (10 ด่าน) -->
        <div class="level-selector" id="level-selector"></div>

        <div id="status">สถานะ: เริ่มเล่นจากด่านที่ 1 ก่อนนะ!</div>
        <div id="score" style="font-weight: bold; color: #d69e2e; margin: 5px 0;">เหรียญที่เก็บได้: 0 / 0</div>
        
        <!-- กระดานเกม -->
        <div class="grid-board" id="board"></div>

        <!-- แผงควบคุมคำสั่ง -->
        <div class="controls">
            <button onclick="movePlayer('UP')">⬆️ เดินขึ้น</button>
            <div class="row-btns">
                <button onclick="movePlayer('LEFT')">⬅️ ซ้าย</button>
                <button onclick="movePlayer('RIGHT')">ขวา ➡️</button>
            </div>
            <button onclick="movePlayer('DOWN')">⬇️ เดินลง</button>
        </div>

        <button class="reset-btn" onclick="resetGame()">🔄 เริ่มด่านนี้ใหม่</button>
    </div>
    
    <!-- สคริปต์เกมหลักของคุณ -->
    <script src="script.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- ระบบเชื่อมต่อฐานข้อมูลสำหรับเกมนี้ -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGu__RjEy0WRI7hYDdKfai9vio8GqWoqw",
            authDomain: "skilldragonyok.firebaseapp.com",
            projectId: "skilldragonyok",
            storageBucket: "skilldragonyok.firebasestorage.app",
            messagingSenderId: "894981973450",
            appId: "1:894981973450:web:39d6f4c2170e774c1d1b33"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // ⭐ ฟังก์ชันสำหรับบันทึกคะแนน (เรียกใช้จาก script.js)
        async function saveCodingScore(finalScore) {
            const user = firebase.auth().currentUser;
            
            if (!user) {
                console.warn("ผู้เล่นยังไม่ได้เข้าสู่ระบบ จึงไม่บันทึกคะแนน");
                return;
            }

            const gameId = 'coding'; // ต้องตรงกับ ID ในหน้า index.html
            const userRef = db.collection('users').doc(user.uid);

            try {
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(userRef);
                    if (!doc.exists) return;

                    const games = doc.data().games || {};
                    const cur = games[gameId] || { total: 0, best: 0, plays: 0 };

                    transaction.update(userRef, {
                        totalScore: firebase.firestore.FieldValue.increment(finalScore),
                        [`games.${gameId}`]: {
                            total: (cur.total || 0) + finalScore,
                            best: Math.max(cur.best || 0, finalScore),
                            plays: (cur.plays || 0) + 1,
                            lastPlayed: new Date()
                        }
                    });
                });
                console.log(`✅ บันทึกคะแนนเกม Coding สำเร็จ: ${finalScore}`);
            } catch (error) {
                console.error("❌ บันทึกคะแนนล้มเหลว:", error);
            }
        }
    </script>
</body>
</html>
