<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ซิ่งเก็บดาว</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: #eaf6ff;
      color: #183153;
      font-family: system-ui, sans-serif;
    }
    .game { width: min(100%, 420px); text-align: center; }
    h1 { margin: 0 0 6px; font-size: 1.7rem; }
    .help { margin: 0 0 12px; font-size: .95rem; }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
      text-align: left;
    }
    label { font-size: .85rem; font-weight: 700; }
    select {
      width: 100%;
      margin-top: 4px;
      padding: 9px;
      border: 2px solid #b9d7ec;
      border-radius: 10px;
      color: #183153;
      background: white;
      font: inherit;
    }
    .stage { position: relative; width: 100%; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 4px solid #183153;
      border-radius: 18px;
      background: #333;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      border-radius: 18px;
      background: #10243dcc;
      color: white;
    }
    .panel {
      max-width: 290px;
      padding: 22px;
      border-radius: 18px;
      background: white;
      color: #183153;
    }
    .panel h2 { margin: 0 0 8px; }
    .panel p { line-height: 1.5; }
    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 20px;
      background: #ffca3a;
      color: #183153;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 12px;
    }
    .controls button { width: 110px; font-size: 1.4rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="game">
    <h1>🏁 ซิ่งเก็บดาว</h1>
    <p class="help">เก็บคำตอบที่ถูกต้อง หลบกรวย แล้วไปให้ถึงด่านถัดไป!</p>

    <div class="options">
      <label>เลือกวิชา
        <select id="subject">
          <option value="math">คณิตศาสตร์</option>
          <option value="thai">ภาษาไทย</option>
          <option value="english">ภาษาอังกฤษ</option>
          <option value="general">ความรู้ทั่วไป</option>
        </select>
      </label>
      <label>เลือกรถ
        <select id="carColor">
          <option value="#ff595e">รถสีแดง</option>
          <option value="#1982c4">รถสีน้ำเงิน</option>
          <option value="#8ac926">รถสีเขียว</option>
          <option value="#9b5de5">รถสีม่วง</option>
        </select>
      </label>
      <label>เลือกสนาม
        <select id="track">
          <option value="meadow">ทุ่งหญ้า</option>
          <option value="desert">ทะเลทราย</option>
          <option value="space">อวกาศ</option>
        </select>
      </label>
    </div>

    <div class="stage">
      <canvas id="gameCanvas" width="360" height="600"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h2 id="overlayTitle">พร้อมซิ่งหรือยัง?</h2>
          <p id="overlayText">เลือกรถ สนาม และวิชาที่อยากฝึก จากนั้นเก็บคำตอบให้ถูกต้อง!</p>
          <button id="startButton">เริ่มเกม</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="leftButton" aria-label="เลี้ยวซ้าย">⬅️</button>
      <button id="rightButton" aria-label="เลี้ยวขวา">➡️</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const startButton = document.getElementById("startButton");
    const W = canvas.width;
    const H = canvas.height;
    const laneX = [90, 180, 270];
    const carY = 500;

    let lane = 1;
    let score = 0;
    let lives = 3;
    let stage = 1;
    let speed = 170;
    let answers = [];
    let cones = [];
    let running = false;
    let lastTime = 0;
    let answerTimer = 0;
    let coneTimer = 0;
    let roadOffset = 0;
    let message = "เก็บคำตอบให้ถูกนะ!";
    let messageTimer = 0;

    const subjectSelect = document.getElementById("subject");
    const carSelect = document.getElementById("carColor");
    const trackSelect = document.getElementById("track");

    const questionBanks = {
      thai: [
        { q: "คำตรงข้ามของ “สูง” คือ?", a: ["ต่ำ", "กว้าง", "ยาว"] , c: 0 },
        { q: "คำใดเป็นชื่อสัตว์?", a: ["แมว", "โต๊ะ", "วิ่ง"], c: 0 },
        { q: "คำใดเป็นผลไม้?", a: ["มะม่วง", "รองเท้า", "ดินสอ"], c: 0 },
        { q: "คำใดมีความหมายว่า “รวดเร็ว”?", a: ["ไว", "ช้า", "หนัก"], c: 0 },
        { q: "คำใดเป็นสี?", a: ["สีฟ้า", "เก้าอี้", "กระโดด"], c: 0 }
      ],
      english: [
        { q: "“Cat” แปลว่าอะไร?", a: ["แมว", "สุนัข", "นก"], c: 0 },
        { q: "“Red” คือสีอะไร?", a: ["สีแดง", "สีเขียว", "สีฟ้า"], c: 0 },
        { q: "“One” หมายถึงเลขใด?", a: ["1", "2", "3"], c: 0 },
        { q: "“Apple” คืออะไร?", a: ["แอปเปิล", "กล้วย", "ส้ม"], c: 0 },
        { q: "“Happy” แปลว่าอะไร?", a: ["มีความสุข", "เหนื่อย", "หิว"], c: 0 }
      ],
      general: [
        { q: "สัตว์ชนิดใดบินได้?", a: ["นก", "ปลา", "เต่า"], c: 0 },
        { q: "ดวงอาทิตย์ขึ้นทางทิศใด?", a: ["ทิศตะวันออก", "ทิศเหนือ", "ทิศใต้"], c: 0 },
        { q: "เรามองเห็นสิ่งต่าง ๆ ด้วยอะไร?", a: ["ตา", "หู", "จมูก"], c: 0 },
        { q: "น้ำแข็งเกิดจากอะไร?", a: ["น้ำที่เย็นจัด", "ทราย", "ควัน"], c: 0 },
        { q: "วันหนึ่งมีกี่ชั่วโมง?", a: ["24", "12", "60"], c: 0 }
      ]
    };

    function makeQuestion() {
      const subject = subjectSelect.value;

      if (subject === "math") {
        const a = Math.floor(Math.random() * 9) + 1;
        const b = Math.floor(Math.random() * 9) + 1;
        const answer = a + b;
        const choices = [answer];

        while (choices.length < 3) {
          const wrong = answer + Math.floor(Math.random() * 9) - 4;
          if (wrong >= 0 && !choices.includes(wrong)) choices.push(wrong);
        }

        return { q: `${a} + ${b} = ?`, choices, correct: 0 };
      }

      const bank = questionBanks[subject];
      const item = bank[Math.floor(Math.random() * bank.length)];
      return { q: item.q, choices: [...item.a], correct: item.c };
    }

    function shuffleQuestion(question) {
      const choices = question.choices.map((text, index) => ({
        text,
        correct: index === question.correct
      }));

      for (let i = choices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [choices[i], choices[j]] = [choices[j], choices[i]];
      }

      return {
        q: question.q,
        choices: choices.map(item => item.text),
        correctLane: choices.findIndex(item => item.correct),
        checked: false,
        y: -35
      };
    }

    function spawnAnswer() {
      answers.push(shuffleQuestion(makeQuestion()));
    }

    function startGame() {
      lane = 1;
      score = 0;
      lives = 3;
      stage = 1;
      speed = 170;
      answers = [];
      cones = [];
      answerTimer = 0;
      coneTimer = 1.5;
      message = "เก็บคำตอบให้ถูกนะ!";
      messageTimer = 2;
      spawnAnswer();
      running = true;
      lastTime = performance.now();
      startButton.textContent = "เริ่มเกม";
      overlay.classList.add("hidden");
      requestAnimationFrame(gameLoop);
    }

    function move(direction) {
      if (!running) return;
      lane = Math.max(0, Math.min(2, lane + direction));
    }

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        event.preventDefault();
        move(-1);
      }
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        event.preventDefault();
        move(1);
      }
    });

    document.getElementById("leftButton").addEventListener("click", () => move(-1));
    document.getElementById("rightButton").addEventListener("click", () => move(1));
    startButton.addEventListener("click", startGame);

    function endGame() {
      running = false;
      overlayTitle.textContent = "จบเกมแล้ว!";
      overlayText.textContent =
        `ได้ ${score} ดาว และไปถึงด่าน ${stage} ลองเล่นอีกครั้งเพื่อทำคะแนนให้สูงขึ้นนะ`;
      startButton.textContent = "เล่นอีกครั้ง";
      overlay.classList.remove("hidden");
    }

    function update(dt) {
      const newStage = Math.floor(score / 5) + 1;
      if (newStage > stage) {
        stage = newStage;
        message = `เก่งมาก! เข้าสู่ด่าน ${stage}`;
        messageTimer = 1.8;
      }

      speed = Math.min(330, 170 + (stage - 1) * 25);
      roadOffset = (roadOffset + speed * dt) % 70;
      answerTimer += dt;
      coneTimer += dt;
      if (messageTimer > 0) messageTimer -= dt;

      if (answerTimer > Math.max(1.7, 2.5 - stage * 0.08)) {
        answerTimer = 0;
        spawnAnswer();
      }

      if (coneTimer > Math.max(1.5, 3.1 - stage * 0.12)) {
        coneTimer = 0;
        cones.push({
          y: -35,
          lane: Math.floor(Math.random() * 3),
          checked: false
        });
      }

      for (const item of answers) {
        item.y += speed * dt;
        if (!item.checked && item.y >= carY - 16) {
          item.checked = true;
          if (item.correctLane === lane) {
            score++;
            message = "เยเย่! เก็บได้ 1 ดาว";
            messageTimer = 1.2;
          } else {
            lives--;
            message = "คำตอบยังไม่ถูก ลองข้อต่อไปนะ";
            messageTimer = 1.3;
          }
        }
      }

      for (const cone of cones) {
        cone.y += speed * dt;
        if (!cone.checked && cone.y >= carY - 16) {
          cone.checked = true;
          if (cone.lane === lane) {
            lives--;
            message = "ชนกรวยแล้ว ระวังหน่อย!";
            messageTimer = 1.2;
          }
        }
      }

      answers = answers.filter(item => item.y < H + 50);
      cones = cones.filter(cone => cone.y < H + 50);

      if (lives <= 0) endGame();
    }

    function drawRoad() {
      const track = trackSelect.value;

      if (track === "desert") {
        ctx.fillStyle = "#e8b45a";
        ctx.fillRect(0, 0, W, H);
      } else if (track === "space") {
        ctx.fillStyle = "#171633";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#ffffff";
        for (let i = 0; i < 24; i++) {
          const x = (i * 47 + 19) % W;
          const y = (i * 83 + 31) % H;
          ctx.fillRect(x, y, 2, 2);
        }
      } else {
        ctx.fillStyle = "#48a868";
        ctx.fillRect(0, 0, W, H);
      }

      ctx.fillStyle = "#42464b";
      ctx.fillRect(35, 0, 290, H);

      ctx.fillStyle = "#f8f1d4";
      ctx.fillRect(35, 0, 5, H);
      ctx.fillRect(320, 0, 5, H);

      ctx.strokeStyle = "#ffffffaa";
      ctx.lineWidth = 4;
      ctx.setLineDash([28, 24]);
      ctx.lineDashOffset = -roadOffset;
      ctx.beginPath();
      ctx.moveTo(135, 0);
      ctx.lineTo(135, H);
      ctx.moveTo(225, 0);
      ctx.lineTo(225, H);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawCar() {
      const x = laneX[lane];

      ctx.fillStyle = "#15191d";
      ctx.fillRect(x - 27, carY + 23, 12, 20);
      ctx.fillRect(x + 15, carY + 23, 12, 20);
      ctx.fillRect(x - 27, carY - 29, 12, 20);
      ctx.fillRect(x + 15, carY - 29, 12, 20);

      ctx.fillStyle = carSelect.value;
      ctx.beginPath();
      ctx.roundRect(x - 21, carY - 37, 42, 78, 11);
      ctx.fill();

      ctx.fillStyle = "#b7eeff";
      ctx.beginPath();
      ctx.roundRect(x - 14, carY - 22, 28, 23, 6);
      ctx.fill();

      ctx.fillStyle = "#fff2a6";
      ctx.fillRect(x - 15, carY + 29, 9, 5);
      ctx.fillRect(x + 6, carY + 29, 9, 5);
    }

    function draw() {
      drawRoad();

      ctx.textAlign = "center";
      ctx.font = "bold 19px system-ui";
      ctx.fillStyle = "white";
      ctx.fillText(`⭐ ${score}`, 70, 35);
      ctx.fillText(`❤️ ${lives}`, 180, 35);
      ctx.fillText(`ด่าน ${stage}`, 285, 35);

      for (const item of answers) {
        ctx.font = "bold 17px system-ui";
        ctx.fillStyle = "#ffeb75";
        ctx.fillText(item.q, 180, item.y - 38);

        item.choices.forEach((value, i) => {
          const x = laneX[i];
          ctx.fillStyle = "#ffca3a";
          ctx.beginPath();
          ctx.arc(x, item.y, 27, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#183153";
          ctx.font = "bold 17px system-ui";
          ctx.fillText(value, x, item.y + 6);
        });
      }

      for (const cone of cones) {
        const x = laneX[cone.lane];
        ctx.fillStyle = "#ff7b00";
        ctx.beginPath();
        ctx.moveTo(x, cone.y - 22);
        ctx.lineTo(x - 20, cone.y + 18);
        ctx.lineTo(x + 20, cone.y + 18);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "white";
        ctx.fillRect(x - 13, cone.y + 4, 26, 5);
      }

      drawCar();

      if (messageTimer > 0) {
        ctx.font = "bold 17px system-ui";
        ctx.fillStyle = "white";
        ctx.fillText(message, 180, 570);
      }
    }

    function gameLoop(now) {
      if (!running) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      draw();
      if (running) requestAnimationFrame(gameLoop);
    }

    draw();
  </script>
</body>
</html>
