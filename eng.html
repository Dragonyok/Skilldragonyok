<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Word Adventure</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --accent: #f59e0b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 60px 12px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ปุ่มกลับหน้าเมนูหลัก */
        .back-home-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            padding: 9px 13px;
            border-radius: 10px;
            background: white;
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .back-home-btn:hover { background: #f1f5f9; }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
        }

        h1 { color: var(--primary); margin-bottom: 10px; }

        .screen { display: none; }
        .screen.active { display: block; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin: 8px;
            font-weight: bold;
        }

        button:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-secondary { background-color: #6b7280; }
        .btn-secondary:hover { background-color: #4b5563; }

        .option-btn {
            display: block;
            width: 100%;
            background: #eef2ff;
            color: var(--primary);
            border: 2px solid var(--primary);
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .option-btn:hover { background: var(--primary); color: white; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e0e7ff;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .timer-container {
            width: 100%;
            background: #e5e7eb;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: #10b981;
            transition: width 1s linear;
        }

        .coin-badge { color: var(--accent); }

        @media (max-width: 480px) {
            .container { padding: 22px 16px; }
            .stats-bar { padding: 10px 12px; font-size: 14px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<a href="index.html" class="back-home-btn" title="กลับหน้าเมนูหลัก">
    🏠 กลับหน้าหลัก
</a>

<div class="container">
    <!-- หน้าแรก: เลือกความยาก -->
    <div id="home-screen" class="screen active">
        <h1>🌟 English Word Adventure 🌟</h1>
        <p>ผจญภัยล่าคำศัพท์ สะสมเหรียญสุดตื่นเต้น!</p>
        <p>เลือกระดับความยากที่คุณต้องการ:</p>
        <button onclick="startGame('easy')">🟢 ง่าย (7-8 ปี) - คำศัพท์พื้นฐาน</button><br>
        <button onclick="startGame('medium')">🟡 ปานกลาง (9-10 ปี) - หมวดหมู่ทั่วไป</button><br>
        <button onclick="startGame('hard')">🔴 ยาก (11-12 ปี) - คำศัพท์ท้าทาย</button>
    </div>

    <!-- หน้าเล่นเกม -->
    <div id="game-screen" class="screen">
        <div class="stats-bar">
            <span>ข้อ <span id="current-q">1</span>/5</span>
            <span class="coin-badge">🪙 เหรียญ: <span id="score">0</span></span>
        </div>

        <div class="timer-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>

        <h2 id="question-text" style="font-size: 24px; margin: 20px 0;">Question</h2>
        <div id="options-container"></div>
        <button class="btn-secondary" onclick="goHome()" style="margin-top: 20px;">
            ⬅ กลับหน้าแรก
        </button>
    </div>

    <!-- หน้าสรุปผล -->
    <div id="result-screen" class="screen">
        <h1>🎉 จบการผจญภัย!</h1>
        <p>ยอดเยี่ยมมาก คุณฝ่าด่านสำเร็จแล้ว</p>
        <h3>🪙 เหรียญทั้งหมดที่สะสมได้: <span id="final-score">0</span></h3>
        <button onclick="goHome()">🏠 กลับสู่หน้าหลัก</button>
    </div>
</div>

<!-- สคริปต์เกมหลัก -->
<script>
    const questionsData = {
        easy: [
            { q: "Apple แปลว่าอะไร?", options: ["แอปเปิ้ล", "ส้ม", "กล้วย", "องุ่น"], answer: 0 },
            { q: "Cat คือสัตว์ชนิดใด?", options: ["สุนัข", "แมว", "นก", "ปลา"], answer: 1 },
            { q: "Red คือสีอะไร?", options: ["สีเขียว", "สีฟ้า", "สีแดง", "สีเหลือง"], answer: 2 },
            { q: "Book แปลว่าอะไร?", options: ["ปากกา", "หนังสือ", "โต๊ะ", "เก้าอี้"], answer: 1 },
            { q: "Sun หมายถึงอะไร?", options: ["ดวงจันทร์", "ดวงอาทิตย์", "ดวงดาว", "ก้อนเมฆ"], answer: 1 }
        ],
        medium: [
            { q: "Hospital แปลว่าอะไร?", options: ["โรงเรียน", "โรงพยาบาล", "ตลาด", "สนามบิน"], answer: 1 },
            { q: "Which one is a fruit?", options: ["Carrot", "Banana", "Potato", "Broccoli"], answer: 1 },
            { q: "Elephant แปลว่าอะไร?", options: ["ม้า", "ช้าง", "เสือ", "สิงโต"], answer: 1 },
            { q: "Yesterday หมายถึงอะไร?", options: ["พรุ่งนี้", "วันนี้", "เมื่อวานนี้", "สัปดาห์หน้า"], answer: 2 },
            { q: "Library คือสถานที่ใด?", options: ["ห้องสมุด", "โรงหนัง", "สวนสนุก", "ร้านค้า"], answer: 0 }
        ],
        hard: [
            { q: "Courage แปลว่าอะไร?", options: ["ความกล้าหาญ", "ความกลัว", "ความเศร้า", "ความโกรธ"], answer: 0 },
            { q: "คำว่า 'Scientist' หมายถึงอาชีพใด?", options: ["วิศวกร", "นักวิทยาศาสตร์", "หมอ", "ครู"], answer: 1 },
            { q: "คำพ้องความหมาย (Synonym) ของคำว่า 'Big' คือข้อใด?", options: ["Small", "Tiny", "Huge", "Short"], answer: 2 },
            { q: "Environment แปลว่าอะไร?", options: ["สิ่งแวดล้อม", "เทคโนโลยี", "เศรษฐกิจ", "การเมือง"], answer: 0 },
            { q: "Successful หมายถึงอะไร?", options: ["ล้มเหลว", "ประสบความสำเร็จ", "โชคดี", "อันตราย"], answer: 1 }
        ]
    };

    let currentLevel = "easy";
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let timer;
    let timeLeft = 10;

    function startGame(level) {
        clearInterval(timer);
        currentLevel = level;
        currentQuestions = [...questionsData[level]];
        currentIndex = 0;
        score = 0;

        document.getElementById("home-screen").classList.remove("active");
        document.getElementById("game-screen").classList.add("active");
        document.getElementById("result-screen").classList.remove("active");

        loadQuestion();
    }

    function loadQuestion() {
        clearInterval(timer);
        if (currentIndex >= currentQuestions.length) {
            endGame();
            return;
        }

        document.getElementById("current-q").innerText = currentIndex + 1;
        document.getElementById("score").innerText = score;

        const qData = currentQuestions[currentIndex];
        document.getElementById("question-text").innerText = qData.q;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        qData.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, qData.answer);
            optionsContainer.appendChild(btn);
        });

        startTimer();
    }

    function startTimer() {
        timeLeft = 10;
        const timerBar = document.getElementById("timer-bar");
        timerBar.style.width = "100%";

        timer = setInterval(() => {
            timeLeft--;
            timerBar.style.width = (timeLeft * 10) + "%";

            if (timeLeft <= 0) {
                clearInterval(timer);
                currentIndex++;
                loadQuestion();
            }
        }, 1000);
    }

    function checkAnswer(selected, correct) {
        clearInterval(timer);
        if (selected === correct) {
            score += 10 + (timeLeft * 2);
        }
        currentIndex++;
        loadQuestion();
    }

    function endGame() {
        document.getElementById("game-screen").classList.remove("active");
        document.getElementById("result-screen").classList.add("active");
        document.getElementById("final-score").innerText = score;

        // ⭐ เรียกฟังก์ชันบันทึกคะแนนลง Firebase
        if (typeof saveEnglishScore === 'function') {
            saveEnglishScore(score);
        }
    }

    function goHome() {
        clearInterval(timer);
        document.getElementById("game-screen").classList.remove("active");
        document.getElementById("result-screen").classList.remove("active");
        document.getElementById("home-screen").classList.add("active");
    }
</script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- ระบบเชื่อมต่อฐานข้อมูลสำหรับเกมภาษาอังกฤษ -->
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAGu__RjEy0WRI7hYDdKfai9vio8GqWoqw",
        authDomain: "skilldragonyok.firebaseapp.com",
        projectId: "skilldragonyok",
        storageBucket: "skilldragonyok.firebasestorage.app",
        messagingSenderId: "894981973450",
        appId: "1:894981973450:web:39d6f4c2170e774c1d1b33"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ⭐ ฟังก์ชันบันทึกคะแนนเกมภาษาอังกฤษ
    async function saveEnglishScore(finalScore) {
        const user = firebase.auth().currentUser;
        
        if (!user) {
            console.warn("ผู้เล่นยังไม่ได้เข้าสู่ระบบ จึงไม่บันทึกคะแนน");
            return;
        }
        
        // ถ้าเล่นได้ 0 คะแนน ไม่ต้องบันทึกก็ได้ (หรือจะลบเงื่อนไขนี้ออกก็ได้ครับ)
        if (finalScore <= 0) return;

        const gameId = 'english'; // ID ต้องตรงกับใน index.html
        const userRef = db.collection('users').doc(user.uid);

        try {
            await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(userRef);
                if (!doc.exists) return;

                const games = doc.data().games || {};
                const cur = games[gameId] || { total: 0, best: 0, plays: 0 };

                transaction.update(userRef, {
                    totalScore: firebase.firestore.FieldValue.increment(finalScore),
                    [`games.${gameId}`]: {
                        total: (cur.total || 0) + finalScore,
                        best: Math.max(cur.best || 0, finalScore),
                        plays: (cur.plays || 0) + 1,
                        lastPlayed: new Date()
                    }
                });
            });
            console.log(`✅ บันทึกคะแนนเกม English สำเร็จ: ${finalScore}`);
        } catch (error) {
            console.error("❌ บันทึกคะแนนล้มเหลว:", error);
        }
    }
</script>
</body>
</html>
