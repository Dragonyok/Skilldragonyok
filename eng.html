<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <title>English Word Adventure</title>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --accent: #f59e0b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 60px 12px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .back-home-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            padding: 9px 13px;
            border-radius: 10px;
            background: white;
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .back-home-btn:hover { background: #f1f5f9; }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
        }

        h1 { color: var(--primary); margin-bottom: 10px; }

        .screen { display: none; }
        .screen.active { display: block; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin: 8px;
            font-weight: bold;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary { background-color: #6b7280; }
        .btn-secondary:hover { background-color: #4b5563; }

        .option-btn {
            display: block;
            width: 100%;
            background: #eef2ff;
            color: var(--primary);
            border: 2px solid var(--primary);
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .option-btn:hover { background: var(--primary); color: white; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e0e7ff;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .timer-container {
            width: 100%;
            background: #e5e7eb;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: #10b981;
            transition: width 1s linear;
        }

        .coin-badge { color: var(--accent); }

        @media (max-width: 480px) {
            .container { padding: 22px 16px; }
            .stats-bar { padding: 10px 12px; font-size: 14px; }
            h1 { font-size: 24px; }
            button { max-width: 100%; }
        }
    </style>
</head>

        function startGame(level) {

            if (!questionsData[level]) {
                alert("ไม่พบชุดคำถามนี้");
                return;
            }

            currentLevel = level;
            currentQuestions = [...questionsData[level]];
            currentIndex = 0;
            score = 0;

            document.getElementById("home-screen").classList.remove("active");
            document.getElementById("game-screen").classList.add("active");
            document.getElementById("result-screen").classList.remove("active");
            document.getElementById("total-q").innerText = currentQuestions.length;
            document.getElementById("score").innerText = score;

            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timer);

            if (currentIndex >= currentQuestions.length) {
                endGame();
                return;
            }

            answered = false;

            document.getElementById("current-q").innerText = currentIndex + 1;
            document.getElementById("score").innerText = score;

            const qData = currentQuestions[currentIndex];
            document.getElementById("question-text").innerText = qData.q;

            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            qData.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.className = "option-btn";
                button.innerText = option;
                button.onclick = () => checkAnswer(index, qData.answer);
                optionsContainer.appendChild(button);
            });

            startTimer();
        }

        function startTimer() {
            timeLeft = 10;

            const timerBar = document.getElementById("timer-bar");
            timerBar.style.width = "100%";

            timer = setInterval(() => {
                timeLeft--;
                timerBar.style.width = Math.max(0, timeLeft * 10) + "%";

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    currentIndex++;
                    loadQuestion();
                }
            }, 1000);
        }

        function checkAnswer(selected, correct) {
            if (answered) return;
            answered = true;
            clearInterval(timer);

            if (selected === correct) {
                score += 1;
                document.getElementById("score").innerText = score;
            }

            currentIndex++;
            loadQuestion();
        }

        function endGame() {
            clearInterval(timer);
            document.getElementById("game-screen").classList.remove("active");
            document.getElementById("result-screen").classList.add("active");
            document.getElementById("final-score").innerText = score;

            if (typeof saveEnglishScore === "function") {
                saveEnglishScore(score);
            }
        }

        function goHome() {
            clearInterval(timer);
            document.getElementById("game-screen").classList.remove("active");
            document.getElementById("result-screen").classList.remove("active");
            document.getElementById("home-screen").classList.add("active");
        }
    </script>

    <!-- ระบบบันทึกคะแนน Firebase -->
    <script>
        const firebaseConfig = {
            apiKey: "ใส่_API_KEY_จริงของคุณ",
            authDomain: "skilldragonyok.firebaseapp.com",
            projectId: "skilldragonyok",
            storageBucket: "skilldragonyok.firebasestorage.app",
            messagingSenderId: "894981973450",
            appId: "1:894981973450:web:39d6f4c2170e774c1d1b33"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();

        async function saveEnglishScore(finalScore) {
            const user = firebase.auth().currentUser;

            if (!user) {
                console.warn("ผู้เล่นยังไม่ได้เข้าสู่ระบบ จึงไม่บันทึกคะแนน");
                return;
            }

            if (finalScore <= 0) return;

            const gameId = "english";
            const userRef = db.collection("users").doc(user.uid);

            try {
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(userRef);
                    if (!doc.exists) return;

                    const games = doc.data().games || {};
                    const currentGame = games[gameId] || {
                        total: 0,
                        best: 0,
                        plays: 0
                    };

                    transaction.update(userRef, {
                        totalScore: firebase.firestore.FieldValue.increment(finalScore),
                        [`games.${gameId}`]: {
                            total: (currentGame.total || 0) + finalScore,
                            best: Math.max(currentGame.best || 0, finalScore),
                            plays: (currentGame.plays || 0) + 1,
                            lastPlayed: new Date()
                        }
                    });
                });

                console.log("บันทึกคะแนนสำเร็จ:", finalScore);
            } catch (error) {
                console.error("บันทึกคะแนนล้มเหลว:", error);
            }
        }
    </script>
