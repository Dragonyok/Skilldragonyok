<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมฝึกคิดตัวเลข: ผจญภัยตามช่วงอายุ</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #2d3436;
            text-align: center;
            margin: 0;
            padding: 60px 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ปุ่มกลับหน้าเมนูหลัก */
        .back-home-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            padding: 9px 13px;
            border-radius: 10px;
            background: white;
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .back-home-btn:hover {
            background: #f1f5f9;
        }

        .game-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 420px;
            width: 100%;
            position: relative;
        }

        h1 {
            color: #0984e3;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: #636e72;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: #dfe6e9;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 16px;
        }

        .question-box {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
            color: #2d3436;
            background: #fab1a0;
            padding: 15px;
            border-radius: 10px;
        }

        input[type="number"] {
            width: 80%;
            padding: 12px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #b2bec3;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        button {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: #019875;
        }

        /* ปุ่มย้อนกลับ */
        .btn-back {
            background-color: #ff7675;
            margin-top: 10px;
        }

        .btn-back:hover {
            background-color: #d63031;
        }

        .message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .age-select-box {
            margin-bottom: 20px;
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
        }

        select {
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #0984e3;
            outline: none;
            margin-top: 5px;
            width: 100%;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 22px 16px;
            }

            .question-box {
                font-size: 28px;
            }

            .stats {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<a href="index.html" class="back-home-btn" title="กลับหน้าเมนูหลัก">
    🏠 กลับหน้าหลัก
</a>

<div class="game-container">
    <h1>🔢 เกมคณิตคิดเร็ว</h1>
    <div class="subtitle">เกมฝึกคิดเลขสนุกๆ สำหรับเด็กๆ</div>

    <!-- หน้าเลือกช่วงอายุ -->
    <div id="setup-screen" class="age-select-box">
        <label for="ageGroup"><b>กรุณาเลือกช่วงอายุของคุณ:</b></label>
        <select id="ageGroup">
            <option value="7-8">อายุ 7-8 ขวบ (บวก/ลบ เลขน้อย)</option>
            <option value="9-10">อายุ 9-10 ขวบ (บวก/ลบ/คูณ เลขปานกลาง)</option>
            <option value="11-12">อายุ 11-12 ขวบ (บวก/ลบ/คูณ/หาร เต็มรูปแบบ)</option>
        </select>
        <br><br>
        <button onclick="startGame()">เริ่มเกมกันเลย! 🚀</button>
    </div>

    <!-- หน้าเล่นเกม -->
    <div id="game-screen" class="hidden">
        <div class="stats">
            <div>คะแนน: <span id="score">0</span></div>
            <div>เวลา: <span id="timer">40</span>s</div>
        </div>

        <div class="question-box" id="question">กำลังโหลด...</div>
        <input type="number" id="answerInput" placeholder="พิมพ์คำตอบ..." autocomplete="off">
        <br>
        <button onclick="checkAnswer()">ส่งคำตอบ 🚀</button>
        <button class="btn-back" onclick="goBackToSetup()">⬅️ กลับไปหน้าเลือกอายุ</button>
        <div class="message" id="message"></div>
    </div>
</div>

<!-- สคริปต์เกมหลัก -->
<script>
    let score = 0;
    let timeLeft = 40;
    let correctAnswer = 0;
    let timerInterval;
    let gameActive = false;
    let currentAgeRange = "7-8";

    const setupScreen = document.getElementById("setup-screen");
    const gameScreen = document.getElementById("game-screen");
    const questionEl = document.getElementById("question");
    const answerInput = document.getElementById("answerInput");
    const scoreEl = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const messageEl = document.getElementById("message");
    const ageSelect = document.getElementById("ageGroup");

    function startGame() {
        clearInterval(timerInterval);

        currentAgeRange = ageSelect.value;
        setupScreen.classList.add("hidden");
        gameScreen.classList.remove("hidden");

        score = 0;
        timeLeft = currentAgeRange === "7-8"
            ? 45
            : (currentAgeRange === "9-10" ? 40 : 35);

        gameActive = true;
        scoreEl.innerText = score;
        timerEl.innerText = timeLeft;
        messageEl.innerText = "";
        answerInput.disabled = false;

        generateQuestion();

        timerInterval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame();
            }
        }, 1000);
    }

    function generateQuestion() {
        let ops = ["+"];
        let maxNum = 20;

        if (currentAgeRange === "7-8") {
            ops = ["+", "-"];
            maxNum = 20;
        } else if (currentAgeRange === "9-10") {
            ops = ["+", "-", "*"];
            maxNum = 50;
        } else if (currentAgeRange === "11-12") {
            ops = ["+", "-", "*", "/"];
            maxNum = 100;
        }

        const op = ops[Math.floor(Math.random() * ops.length)];
        let num1;
        let num2;

        if (op === "+") {
            num1 = Math.floor(Math.random() * maxNum) + 1;
            num2 = Math.floor(Math.random() * maxNum) + 1;
            correctAnswer = num1 + num2;
        } else if (op === "-") {
            num1 = Math.floor(Math.random() * maxNum) + 5;
            num2 = Math.floor(Math.random() * num1) + 1;
            correctAnswer = num1 - num2;
        } else if (op === "*") {
            num1 = Math.floor(Math.random() * 12) + 1;
            num2 = Math.floor(Math.random() * 12) + 1;
            correctAnswer = num1 * num2;
        } else if (op === "/") {
            num2 = Math.floor(Math.random() * 10) + 1;
            const multiplier = Math.floor(Math.random() * 10) + 1;
            num1 = num2 * multiplier;
            correctAnswer = multiplier;
        }

        let displayOp = op;
        if (op === "*") displayOp = "×";
        if (op === "/") displayOp = "÷";

        questionEl.innerText = `${num1} ${displayOp} ${num2} = ?`;
        answerInput.value = "";
        answerInput.focus();
    }

    function checkAnswer() {
        if (!gameActive) return;

        const userAnswer = parseInt(answerInput.value, 10);

        if (userAnswer === correctAnswer) {
            score += 1;
            scoreEl.innerText = score;
            messageEl.style.color = "#00b894";
            messageEl.innerText = "🎉 ถูกต้อง! เก่งมาก +10 แต้ม";
            generateQuestion();
        } else {
            messageEl.style.color = "#d63031";
            messageEl.innerText = "❌ ผิดจ้า ลองใหม่อีกครั้ง!";
            answerInput.value = "";
            answerInput.focus();
        }
    }

    function endGame() {
        gameActive = false;
        answerInput.disabled = true;
        questionEl.innerText = "หมดเวลา! ⏰";
        messageEl.style.color = "#0984e3";
        messageEl.innerHTML =
            `จบเกมสำหรับช่วงอายุ <b>${currentAgeRange} ปี</b><br>` +
            `ทำคะแนนได้ <b>${score}</b> คะแนน<br><br>` +
            `<button onclick="startGame()">เล่นรอบนี้อีกครั้ง 🔄</button>` +
            `<button class="btn-back" onclick="goBackToSetup()">⬅️ กลับไปหน้าเลือกอายุ</button>`;

        // ⭐ เรียกฟังก์ชันบันทึกคะแนนลง Firebase
        if (typeof saveMathScore === 'function') {
            saveMathScore(score);
        }
    }

    function goBackToSetup() {
        clearInterval(timerInterval);
        gameActive = false;
        gameScreen.classList.add("hidden");
        setupScreen.classList.remove("hidden");
    }

    answerInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            checkAnswer();
        }
    });
</script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- ระบบเชื่อมต่อฐานข้อมูลสำหรับเกมคณิตศาสตร์ -->
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAGu__RjEy0WRI7hYDdKfai9vio8GqWoqw",
        authDomain: "skilldragonyok.firebaseapp.com",
        projectId: "skilldragonyok",
        storageBucket: "skilldragonyok.firebasestorage.app",
        messagingSenderId: "894981973450",
        appId: "1:894981973450:web:39d6f4c2170e774c1d1b33"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ⭐ ฟังก์ชันบันทึกคะแนนเกมคณิตศาสตร์
    async function saveMathScore(finalScore) {
        const user = firebase.auth().currentUser;
        
        if (!user) {
            console.warn("ผู้เล่นยังไม่ได้เข้าสู่ระบบ จึงไม่บันทึกคะแนน");
            return;
        }
        
        // ถ้าเล่นได้ 0 คะแนน ไม่ต้องบันทึก
        if (finalScore <= 0) return;

        const gameId = 'math'; // ID ต้องตรงกับใน index.html
        const userRef = db.collection('users').doc(user.uid);

        try {
            await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(userRef);
                if (!doc.exists) return;

                const games = doc.data().games || {};
                const cur = games[gameId] || { total: 0, best: 0, plays: 0 };

                transaction.update(userRef, {
                    totalScore: firebase.firestore.FieldValue.increment(finalScore),
                    [`games.${gameId}`]: {
                        total: (cur.total || 0) + finalScore,
                        best: Math.max(cur.best || 0, finalScore),
                        plays: (cur.plays || 0) + 1,
                        lastPlayed: new Date()
                    }
                });
            });
            console.log(`✅ บันทึกคะแนนเกม Math สำเร็จ: ${finalScore}`);
        } catch (error) {
            console.error("❌ บันทึกคะแนนล้มเหลว:", error);
        }
    }
</script>
</body>
</html>
