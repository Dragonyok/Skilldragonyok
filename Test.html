<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>พิชิตสนามสอบเข้า ม.1</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      font-family: system-ui, sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #dbeafe, #f5d0fe);
    }

    .back-home-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 9px 13px;
      border-radius: 10px;
      background: white;
      color: #334155;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 2px 8px #33415524;
    }

    .back-home-btn:hover {
      background: #eef2ff;
    }

    .game {
      width: min(100%, 700px);
      padding: 28px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 16px 45px #33415524;
    }

    h1 { margin: 0 0 10px; color: #4338ca; }
    p { line-height: 1.6; }
    .muted { color: #64748b; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 700;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
      background: white;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { cursor: default; }

    .primary {
      margin: 10px 8px 0 0;
      background: #4f46e5;
      color: white;
      font-weight: 700;
    }

    .primary:hover { background: #4338ca; }

    .back-button {
      margin: 0 0 14px;
      padding: 9px 13px;
      background: #e2e8f0;
      color: #334155;
      font-weight: 700;
    }

    .back-button:hover { background: #cbd5e1; }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .bar {
      height: 10px;
      margin: 8px 0 20px;
      overflow: hidden;
      border-radius: 99px;
      background: #e2e8f0;
    }

    .fill {
      width: 100%;
      height: 100%;
      background: #22c55e;
      transition: width 0.4s linear;
    }

    .fill.low { background: #ef4444; }

    .question {
      margin-top: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.6;
    }

    .options {
      display: grid;
      gap: 10px;
      margin: 18px 0;
    }

    .option {
      text-align: left;
      background: #f1f5f9;
      border: 2px solid transparent;
    }

    .option:hover:not(:disabled) { background: #e0e7ff; }
    .option:disabled { color: #1e293b; }

    .correct {
      border-color: #22c55e;
      background: #dcfce7 !important;
    }

    .wrong {
      border-color: #ef4444;
      background: #fee2e2 !important;
    }

    .feedback {
      min-height: 52px;
      line-height: 1.6;
      font-weight: 600;
    }

    .best {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #eef2ff;
      color: #3730a3;
    }

    .hidden { display: none; }

    @media (max-width: 480px) {
      .game { padding: 20px; }
      .topline { font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-home-btn" title="กลับหน้าเมนูหลัก">
    🏠 กลับหน้าหลัก
  </a>

  <main class="game">
    <section id="startScreen">
      <h1>🎓 พิชิตสนามสอบเข้า ม.1</h1>
      <p>ฝึกทำโจทย์ จับเวลา ดูเฉลย และสะสมคะแนนสูงสุด</p>

      <label for="subjectSelect">เลือกหมวดวิชา</label>
      <select id="subjectSelect" onchange="showBestScore()">
        <option value="all">รวมทุกวิชา — สุ่ม 10 ข้อ</option>
        <option value="คณิตศาสตร์">คณิตศาสตร์ — 30 ข้อ</option>
        <option value="วิทยาศาสตร์">วิทยาศาสตร์ — 30 ข้อ</option>
        <option value="ภาษาไทย">ภาษาไทย — 30 ข้อ</option>
        <option value="ภาษาอังกฤษ">ภาษาอังกฤษ — 30 ข้อ</option>
        <option value="การคิดวิเคราะห์">การคิดวิเคราะห์ — 30 ข้อ</option>
      </select>

      <div class="best" id="bestOnStart">คะแนนสูงสุด: ยังไม่มี</div>
      <button class="primary" onclick="startGame()">เริ่มเล่น</button>
      <p class="muted">คะแนนสูงสุดเก็บไว้ในเบราว์เซอร์เครื่องนี้</p>
    </section>

    <section id="quizScreen" class="hidden">
      <button class="back-button" onclick="backToStart()">← ย้อนกลับ</button>

      <div class="topline">
        <span id="counter"></span>
        <span id="score"></span>
        <span id="timerText"></span>
      </div>

      <div class="bar"><div class="fill" id="timerFill"></div></div>
      <div class="muted" id="subjectName"></div>
      <div class="question" id="questionText"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button class="primary hidden" id="nextButton" onclick="nextQuestion()">
        ข้อต่อไป
      </button>
    </section>

    <section id="resultScreen" class="hidden">
      <h1>🏆 จบเกมแล้ว!</h1>
      <div id="resultText"></div>
      <div class="best" id="bestAtEnd"></div>
      <button class="primary" onclick="backToStart()">กลับไปเลือกหมวด</button>
      <button class="primary" onclick="startGame()">เล่นอีกครั้ง</button>
    </section>
  </main>

  <script>
    const TIME_PER_QUESTION = 20;

    // แต่ละข้อ: [โจทย์, ตัวเลือก 4 ข้อ, เลขคำตอบที่ถูก (เริ่มนับจาก 0), เฉลย]
    const rawQuestions = {
      "คณิตศาสตร์": [
        ["25 + 17 มีค่าเท่าไร?", ["32", "42", "52", "62"], 1, "25 + 17 = 42"],
        ["100 - 38 มีค่าเท่าไร?", ["52", "62", "68", "72"], 1, "100 - 38 = 62"],
        ["12 × 8 มีค่าเท่าไร?", ["86", "92", "96", "108"], 2, "12 × 8 = 96"],
        ["144 ÷ 12 มีค่าเท่าไร?", ["10", "11", "12", "14"], 2, "144 ÷ 12 = 12"],
        ["3/4 + 1/8 มีค่าเท่าไร?", ["5/8", "6/8", "7/8", "1"], 2, "3/4 = 6/8 ดังนั้น 6/8 + 1/8 = 7/8"],
        ["5/6 - 1/3 มีค่าเท่าไร?", ["1/6", "1/2", "2/3", "5/3"], 1, "1/3 = 2/6 ดังนั้น 5/6 - 2/6 = 1/2"],
        ["0.6 เขียนเป็นเศษส่วนอย่างต่ำได้เท่าไร?", ["1/6", "3/5", "2/3", "6/5"], 1, "0.6 = 6/10 = 3/5"],
        ["20% ของ 150 มีค่าเท่าไร?", ["20", "25", "30", "35"], 2, "150 × 20/100 = 30"],
        ["สินค้าราคา 80 บาท ลดเหลือ 60 บาท ลดไปกี่เปอร์เซ็นต์?", ["20%", "25%", "30%", "40%"], 1, "ลด 20 บาท จาก 80 บาท คิดเป็น 25%"],
        ["สี่เหลี่ยมผืนผ้ายาว 9 ซม. กว้าง 4 ซม. มีพื้นที่เท่าไร?", ["13", "26", "36", "40"], 2, "พื้นที่ = 9 × 4 = 36 ตารางเซนติเมตร"],
        ["สี่เหลี่ยมจัตุรัสด้านละ 7 ซม. มีเส้นรอบรูปเท่าไร?", ["14", "21", "28", "49"], 2, "เส้นรอบรูป = 4 × 7 = 28 เซนติเมตร"],
        ["สามเหลี่ยมฐาน 10 ซม. สูง 6 ซม. มีพื้นที่เท่าไร?", ["16", "30", "60", "80"], 1, "พื้นที่สามเหลี่ยม = 1/2 × 10 × 6 = 30 ตารางเซนติเมตร"],
        ["วงกลมรัศมี 7 ซม. มีเส้นผ่านศูนย์กลางเท่าไร?", ["7", "14", "21", "28"], 1, "เส้นผ่านศูนย์กลาง = 2 × รัศมี = 14 เซนติเมตร"],
        ["ค่าเฉลี่ยของ 4, 6, 8 และ 10 คือเท่าไร?", ["6", "7", "8", "9"], 1, "(4 + 6 + 8 + 10) ÷ 4 = 7"],
        ["อัตราส่วน 2:3 มีผลรวมของจำนวนส่วนเท่าไร?", ["1", "5", "6", "9"], 1, "ผลรวมจำนวนส่วนคือ 2 + 3 = 5"],
        ["1.5 เมตร เท่ากับกี่เซนติเมตร?", ["15", "105", "150", "1,500"], 2, "1 เมตร = 100 เซนติเมตร ดังนั้น 1.5 เมตร = 150 เซนติเมตร"],
        ["2.5 กิโลกรัม เท่ากับกี่กรัม?", ["25", "250", "2,500", "25,000"], 2, "1 กิโลกรัม = 1,000 กรัม ดังนั้น 2.5 กิโลกรัม = 2,500 กรัม"],
        ["ถ้า x + 9 = 15 แล้ว x เท่ากับเท่าไร?", ["4", "5", "6", "7"], 2, "x = 15 - 9 = 6"],
        ["ถ้า 3x = 21 แล้ว x เท่ากับเท่าไร?", ["6", "7", "8", "9"], 1, "x = 21 ÷ 3 = 7"],
        ["จำนวนถัดไปของ 5, 10, 15, 20 คืออะไร?", ["22", "24", "25", "30"], 2, "เพิ่มครั้งละ 5 ดังนั้นจำนวนถัดไปคือ 25"],
        ["จำนวนถัดไปของ 2, 4, 8, 16 คืออะไร?", ["18", "24", "30", "32"], 3, "คูณ 2 ทุกครั้ง ดังนั้น 16 × 2 = 32"],
        ["จำนวนใดเป็นจำนวนเฉพาะ?", ["21", "27", "29", "33"], 2, "29 หารลงตัวได้ด้วย 1 และ 29 เท่านั้น"],
        ["ห.ร.ม. ของ 12 และ 18 คือเท่าไร?", ["3", "6", "9", "12"], 1, "ตัวหารร่วมมากที่สุดของ 12 และ 18 คือ 6"],
        ["ค.ร.น. ของ 4 และ 6 คือเท่าไร?", ["8", "10", "12", "24"], 2, "จำนวนที่น้อยที่สุดซึ่งหารด้วย 4 และ 6 ลงตัวคือ 12"],
        ["1 ชั่วโมง 45 นาที เท่ากับกี่นาที?", ["95", "100", "105", "115"], 2, "60 + 45 = 105 นาที"],
        ["3 โหล เท่ากับกี่ชิ้น?", ["24", "30", "36", "48"], 2, "1 โหลมี 12 ชิ้น ดังนั้น 3 โหลมี 36 ชิ้น"],
        ["มีลูกบอลสีแดง 3 ลูก สีน้ำเงิน 2 ลูก รวมกี่ลูก?", ["4", "5", "6", "8"], 1, "3 + 2 = 5 ลูก"],
        ["จำนวนใดเป็นจำนวนคู่?", ["17", "23", "36", "41"], 2, "36 หารด้วย 2 ลงตัว จึงเป็นจำนวนคู่"],
        ["หนังสือ 1 เล่มราคา 35 บาท ซื้อ 4 เล่ม ต้องจ่ายเท่าไร?", ["120", "130", "140", "150"], 2, "35 × 4 = 140 บาท"],
        ["มีเงิน 200 บาท ซื้อของราคา 135 บาท จะเหลือเท่าไร?", ["55", "65", "75", "85"], 1, "200 - 135 = 65 บาท"]
      ],

      "วิทยาศาสตร์": [
        ["พืชใช้แก๊สชนิดใดในการสังเคราะห์ด้วยแสง?", ["ออกซิเจน", "คาร์บอนไดออกไซด์", "ไนโตรเจน", "ฮีเลียม"], 1, "พืชใช้คาร์บอนไดออกไซด์ น้ำ และพลังงานแสงในการสังเคราะห์ด้วยแสง"],
        ["พืชสร้างอาหารได้มากที่บริเวณใด?", ["ราก", "ดอก", "ใบ", "เมล็ด"], 2, "ใบมีคลอโรฟิลล์ที่ช่วยรับพลังงานแสง"],
        ["น้ำแข็งเปลี่ยนเป็นน้ำเรียกการเปลี่ยนสถานะว่าอะไร?", ["การระเหย", "การควบแน่น", "การหลอมเหลว", "การแข็งตัว"], 2, "ของแข็งเปลี่ยนเป็นของเหลวเรียกว่าการหลอมเหลว"],
        ["น้ำเดือดที่อุณหภูมิประมาณเท่าไรในความดันปกติ?", ["0°C", "50°C", "100°C", "200°C"], 2, "น้ำเดือดที่ประมาณ 100°C ในความดันบรรยากาศปกติ"],
        ["น้ำแข็งบริสุทธิ์หลอมเหลวที่อุณหภูมิประมาณเท่าไร?", ["0°C", "10°C", "50°C", "100°C"], 0, "น้ำแข็งบริสุทธิ์หลอมเหลวที่ประมาณ 0°C"],
        ["แรงใดดึงวัตถุให้ตกลงสู่พื้นโลก?", ["แรงเสียดทาน", "แรงโน้มถ่วง", "แรงแม่เหล็ก", "แรงลอยตัว"], 1, "แรงโน้มถ่วงของโลกดึงวัตถุเข้าหาโลก"],
        ["อวัยวะใดสูบฉีดเลือดไปทั่วร่างกาย?", ["ปอด", "หัวใจ", "กระเพาะอาหาร", "ไต"], 1, "หัวใจทำหน้าที่สูบฉีดเลือดไปเลี้ยงส่วนต่าง ๆ ของร่างกาย"],
        ["อวัยวะใดช่วยแลกเปลี่ยนแก๊สในการหายใจ?", ["ปอด", "ตับ", "ไต", "ลำไส้"], 0, "ปอดทำหน้าที่แลกเปลี่ยนออกซิเจนและคาร์บอนไดออกไซด์"],
        ["กระดูกมีหน้าที่สำคัญอย่างไร?", ["ย่อยอาหาร", "ค้ำจุนร่างกาย", "สูบฉีดเลือด", "สร้างเสียง"], 1, "กระดูกช่วยค้ำจุนร่างกายและปกป้องอวัยวะบางส่วน"],
        ["สัตว์ชนิดใดเป็นสัตว์เลี้ยงลูกด้วยนม?", ["กบ", "ปลาทอง", "ค้างคาว", "เต่า"], 2, "ค้างคาวออกลูกเป็นตัวและเลี้ยงลูกด้วยน้ำนม"],
        ["สัตว์ชนิดใดหายใจด้วยเหงือก?", ["ปลา", "แมว", "นก", "งู"], 0, "ปลาใช้เหงือกในการแลกเปลี่ยนแก๊สในน้ำ"],
        ["ส่วนใดของพืชทำหน้าที่ดูดน้ำและแร่ธาตุ?", ["ดอก", "ใบ", "ราก", "ผล"], 2, "รากช่วยดูดน้ำและแร่ธาตุจากดิน"],
        ["โลกหมุนรอบตัวเองทำให้เกิดอะไร?", ["ฤดูกาล", "กลางวันและกลางคืน", "ข้างขึ้นข้างแรม", "สุริยุปราคา"], 1, "โลกหมุนรอบตัวเองทำให้เกิดกลางวันและกลางคืน"],
        ["โลกโคจรรอบสิ่งใด?", ["ดวงจันทร์", "ดาวอังคาร", "ดวงอาทิตย์", "ดาวพฤหัสบดี"], 2, "โลกโคจรรอบดวงอาทิตย์"],
        ["ดวงจันทร์ได้รับแสงสว่างจากที่ใด?", ["สร้างแสงเอง", "สะท้อนแสงจากดวงอาทิตย์", "แสงจากโลก", "แสงจากดาวฤกษ์อื่น"], 1, "ดวงจันทร์มองเห็นสว่างเพราะสะท้อนแสงจากดวงอาทิตย์"],
        ["วัสดุใดถูกแม่เหล็กดูดได้?", ["ไม้", "พลาสติก", "เหล็ก", "กระดาษ"], 2, "เหล็กเป็นวัสดุที่ถูกแม่เหล็กดูดได้"],
        ["เสียงเดินทางผ่านสิ่งใดได้?", ["สุญญากาศเท่านั้น", "ตัวกลาง เช่น อากาศหรือน้ำ", "แสงเท่านั้น", "ไม่มีตัวกลาง"], 1, "เสียงต้องอาศัยตัวกลางในการเดินทาง"],
        ["พลังงานจากดวงอาทิตย์จัดเป็นพลังงานชนิดใด?", ["พลังงานแสง", "พลังงานเสียง", "พลังงานเคมีเท่านั้น", "พลังงานแม่เหล็ก"], 0, "ดวงอาทิตย์ให้พลังงานแสงและพลังงานความร้อน"],
        ["ข้อใดเป็นแหล่งพลังงานหมุนเวียน?", ["ถ่านหิน", "น้ำมัน", "ลม", "ก๊าซธรรมชาติ"], 2, "พลังงานลมเป็นพลังงานหมุนเวียน"],
        ["การระเหยคือการเปลี่ยนสถานะจากอะไรเป็นอะไร?", ["ของแข็งเป็นของเหลว", "ของเหลวเป็นแก๊ส", "แก๊สเป็นของเหลว", "ของเหลวเป็นของแข็ง"], 1, "การระเหยคือของเหลวเปลี่ยนเป็นแก๊ส"],
        ["ไอน้ำเย็นตัวแล้วกลายเป็นหยดน้ำเรียกว่าอะไร?", ["การหลอมเหลว", "การระเหย", "การควบแน่น", "การแข็งตัว"], 2, "แก๊สเปลี่ยนเป็นของเหลวเรียกว่าการควบแน่น"],
        ["น้ำบริสุทธิ์มีสูตรเคมีใด?", ["CO₂", "O₂", "H₂O", "NaCl"], 2, "สูตรเคมีของน้ำคือ H₂O"],

        ["คน 4 คนจับมือกันเป็นคู่ แต่ละคู่จับมือครั้งเดียว จะจับมือทั้งหมดกี่ครั้ง?", ["4", "5", "6", "8"], 2, "คน 4 คนจับมือกันได้ทั้งหมด 6 คู่"],
        ["A มาก่อน B และ B มาก่อน C ใครอยู่ลำดับสุดท้าย?", ["A", "B", "C", "บอกไม่ได้"], 2, "ลำดับคือ A, B, C ดังนั้น C อยู่ลำดับสุดท้าย"],
        ["กล่องมีลูกบอลสีแดง 3 ลูกและสีน้ำเงิน 2 ลูก สีใดมีมากกว่า?", ["สีแดง", "สีน้ำเงิน", "เท่ากัน", "ไม่มีข้อมูล"], 0, "สีแดงมี 3 ลูก มากกว่าสีน้ำเงินที่มี 2 ลูก"],
        ["จงหาจำนวนถัดไป: 7, 14, 21, 28, __", ["30", "32", "35", "42"], 2, "เพิ่มครั้งละ 7 ดังนั้นจำนวนถัดไปคือ 35"],
        ["มีหนังสือ 12 เล่ม ใส่กล่องละ 4 เล่ม ต้องใช้กี่กล่อง?", ["2", "3", "4", "6"], 1, "12 ÷ 4 = 3 กล่อง"],
        ["แมวทุกตัวมีหาง และมะลิเป็นแมว สรุปได้ว่าอย่างไร?", ["มะลิมีหาง", "มะลิเป็นสุนัข", "แมวไม่มีหาง", "สรุปไม่ได้"], 0, "เมื่อแมวทุกตัวมีหาง และมะลิเป็นแมว มะลิจึงมีหาง"],
        ["จงหาจำนวนถัดไป: 1, 3, 6, 10, __", ["12", "14", "15", "16"], 2, "เพิ่มทีละ 2, 3, 4 ดังนั้นครั้งถัดไปเพิ่ม 5 ได้ 15"],
        ["เชือกยาว 24 เมตร ตัดเป็น 6 ส่วนเท่า ๆ กัน แต่ละส่วนยาวเท่าไร?", ["3", "4", "5", "6"], 1, "24 ÷ 6 = 4 เมตร"],
        ["วันนี้เป็นวันศุกร์ อีก 3 วันจะเป็นวันอะไร?", ["วันเสาร์", "วันอาทิตย์", "วันจันทร์", "วันอังคาร"], 2, "นับจากวันศุกร์ไป 3 วันคือวันจันทร์"],
        ["แพรวอยู่ลำดับที่ 3 จากด้านหน้า มีคนอยู่ข้างหน้าแพรวกี่คน?", ["2", "3", "5", "7"], 0, "มีคนอยู่ก่อนลำดับที่ 3 จำนวน 2 คน"],
        ["20 + 20 เท่ากับเท่าไร?", ["30", "35", "40", "50"], 2, "20 + 20 = 40"],
        ["จงหาจำนวนถัดไป: 100, 90, 80, 70, __", ["50", "55", "60", "65"], 2, "ลดลงครั้งละ 10 ดังนั้นจำนวนถัดไปคือ 60"],
        ["มีแอปเปิล 2 ผล ส้ม 3 ผล และกล้วย 1 ผล รวมกี่ผล?", ["5", "6", "7", "8"], 1, "2 + 3 + 1 = 6 ผล"],
        ["ใบแรกหนักกว่าใบที่สอง และใบที่สองหนักกว่าใบที่สาม ใบใดเบาที่สุด?", ["ใบแรก", "ใบที่สอง", "ใบที่สาม", "หนักเท่ากัน"], 2, "ใบที่สามเบากว่าใบที่สอง และใบที่สองเบากว่าใบแรก"],
        ["มีไฟ 5 ดวง เปิดอยู่ 2 ดวง ดับอยู่กี่ดวง?", ["2", "3", "5", "7"], 1, "มีทั้งหมด 5 ดวง เปิด 2 ดวง จึงดับ 5 - 2 = 3 ดวง"],
        ["จงหาจำนวนถัดไป: 4, 8, 12, 16, __", ["18", "20", "22", "24"], 1, "เพิ่มครั้งละ 4 ดังนั้นจำนวนถัดไปคือ 20"]
      ]
    };

    const questionBank = Object.entries(rawQuestions).flatMap(
      ([subject, rows]) =>
        rows.map(([text, choices, answer, explain]) => ({
          subject, text, choices, answer, explain
        }))
    );

    let questions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let timeLeft = TIME_PER_QUESTION;
    let timerId = null;
    let locked = false;
    let selectedMode = "all";

    function showScreen(screenId) {
      document.querySelectorAll("main section").forEach(section => {
        section.classList.add("hidden");
      });
      document.getElementById(screenId).classList.remove("hidden");
    }

    function shuffle(items) {
      const result = [...items];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function getBestScore(mode) {
      try {
        return Number(localStorage.getItem(`m1-best-${mode}`)) || 0;
      } catch {
        return 0;
      }
    }

    function showBestScore() {
      const mode = document.getElementById("subjectSelect").value;
      document.getElementById("bestOnStart").textContent =
        `คะแนนสูงสุด: ${getBestScore(mode)}%`;
    }

    function startGame() {
      clearInterval(timerId);
      selectedMode = document.getElementById("subjectSelect").value;

      const pool = selectedMode === "all"
        ? questionBank
        : questionBank.filter(question => question.subject === selectedMode);

      questions = selectedMode === "all"
        ? shuffle(pool).slice(0, 10)
        : shuffle(pool);

      currentIndex = 0;
      correctCount = 0;
      showScreen("quizScreen");
      renderQuestion();
    }

    function renderQuestion() {
      locked = false;
      timeLeft = TIME_PER_QUESTION;

      const question = questions[currentIndex];

      document.getElementById("counter").textContent =
        `ข้อ ${currentIndex + 1} / ${questions.length}`;
      document.getElementById("score").textContent =
        `ตอบถูก ${correctCount}`;
      document.getElementById("timerText").textContent =
        `เวลา ${timeLeft} วินาที`;
      document.getElementById("subjectName").textContent =
        question.subject;
      document.getElementById("questionText").textContent =
        question.text;
      document.getElementById("feedback").textContent = "";
      document.getElementById("nextButton").classList.add("hidden");

      const timerFill = document.getElementById("timerFill");
      timerFill.style.width = "100%";
      timerFill.classList.remove("low");

      const options = document.getElementById("options");
      options.innerHTML = "";

      question.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = `${["ก", "ข", "ค", "ง"][index]}. ${choice}`;
        button.onclick = () => answerQuestion(index);
        options.appendChild(button);
      });

      clearInterval(timerId);
      timerId = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      if (locked) return;

      timeLeft--;
      document.getElementById("timerText").textContent =
        `เวลา ${timeLeft} วินาที`;

      const timerFill = document.getElementById("timerFill");
      timerFill.style.width =
        `${(timeLeft / TIME_PER_QUESTION) * 100}%`;

      if (timeLeft <= 5) timerFill.classList.add("low");
      if (timeLeft <= 0) answerQuestion(null);
    }

    function answerQuestion(selectedIndex) {
      if (locked) return;

      locked = true;
      clearInterval(timerId);

      const question = questions[currentIndex];
      const buttons = document.querySelectorAll(".option");

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === question.answer) button.classList.add("correct");
      });

      if (selectedIndex === question.answer) {
        correctCount++;
        document.getElementById("feedback").textContent =
          `ถูกต้อง! ${question.explain}`;
      } else if (selectedIndex === null) {
        document.getElementById("feedback").textContent =
          `หมดเวลา! คำตอบที่ถูกคือ ${["ก", "ข", "ค", "ง"][question.answer]} — ${question.explain}`;
      } else {
        buttons[selectedIndex].classList.add("wrong");
        document.getElementById("feedback").textContent =
          `ยังไม่ถูกนะ ${question.explain}`;
      }

      document.getElementById("score").textContent =
        `ตอบถูก ${correctCount}`;

      const nextButton = document.getElementById("nextButton");
      nextButton.textContent =
        currentIndex === questions.length - 1 ? "ดูผลคะแนน" : "ข้อต่อไป";
      nextButton.classList.remove("hidden");
    }

    function nextQuestion() {
      currentIndex++;

      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        finishGame();
      }
    }

    function finishGame() {
      clearInterval(timerId);

      const percentage = Math.round(
        (correctCount / questions.length) * 100
      );
      const newBest = Math.max(getBestScore(selectedMode), percentage);

      try {
        localStorage.setItem(`m1-best-${selectedMode}`, String(newBest));
      } catch {
        // เกมยังเล่นได้ แม้เบราว์เซอร์จะปิดการบันทึกข้อมูล
      }

      let message = "ฝึกต่ออีกนิด แล้วลองเล่นใหม่ได้เลย";
      if (percentage === 100) {
        message = "ยอดเยี่ยม! ตอบถูกทุกข้อ";
      } else if (percentage >= 70) {
        message = "ทำได้ดีมาก! ทบทวนข้อที่พลาดอีกนิด";
      } else if (percentage >= 40) {
        message = "เริ่มต้นได้ดี ลองอ่านเฉลยแล้วเล่นอีกครั้ง";
      }

      document.getElementById("resultText").innerHTML =
        `<p>ตอบถูก <strong>${correctCount} จาก ${questions.length} ข้อ</strong> (${percentage}%)</p>
         <p>${message}</p>`;

      document.getElementById("bestAtEnd").textContent =
        `คะแนนสูงสุดของหมวดนี้: ${newBest}%`;

      showScreen("resultScreen");
    }

    function backToStart() {
      clearInterval(timerId);
      showScreen("startScreen");
      showBestScore();
    }

    showBestScore();
  </script>
