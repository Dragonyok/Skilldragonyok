<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>พิชิตสนามสอบเข้า ม.1</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 70px 18px 18px;
      font-family: system-ui, sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #dbeafe, #f5d0fe);
    }

    .back-home-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 9px 13px;
      border-radius: 10px;
      background: white;
      color: #334155;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 2px 8px #33415524;
    }

    .back-home-btn:hover { background: #eef2ff; }

    .game {
      width: min(100%, 700px);
      padding: 28px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 16px 45px #33415524;
    }

    h1 { margin: 0 0 10px; color: #4338ca; }
    p { line-height: 1.6; }
    .muted { color: #64748b; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 700;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
      background: white;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { cursor: default; }

    .primary {
      margin: 10px 8px 0 0;
      background: #4f46e5;
      color: white;
      font-weight: 700;
    }

    .primary:hover { background: #4338ca; }

    .back-button {
      margin: 0 0 14px;
      padding: 9px 13px;
      background: #e2e8f0;
      color: #334155;
      font-weight: 700;
    }

    .back-button:hover { background: #cbd5e1; }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .bar {
      height: 10px;
      margin: 8px 0 20px;
      overflow: hidden;
      border-radius: 99px;
      background: #e2e8f0;
    }

    .fill {
      width: 100%;
      height: 100%;
      background: #22c55e;
      transition: width 0.4s linear;
    }

    .fill.low { background: #ef4444; }

    .question {
      margin-top: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.6;
    }

    .options {
      display: grid;
      gap: 10px;
      margin: 18px 0;
    }

    .option {
      text-align: left;
      background: #f1f5f9;
      border: 2px solid transparent;
    }

    .option:hover:not(:disabled) { background: #e0e7ff; }
    .option:disabled { color: #1e293b; }

    .correct {
      border-color: #22c55e;
      background: #dcfce7 !important;
    }

    .wrong {
      border-color: #ef4444;
      background: #fee2e2 !important;
    }

    .feedback {
      min-height: 52px;
      line-height: 1.6;
      font-weight: 600;
    }

    .best {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #eef2ff;
      color: #3730a3;
    }

    .hidden { display: none; }

    @media (max-width: 480px) {
      .game { padding: 20px; }
      .topline { font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-home-btn">กลับหน้าหลัก</a>

  <main class="game">
    <section id="startScreen">
      <h1>🎓 พิชิตสนามสอบเข้า ม.1</h1>
      <p>ฝึกทำโจทย์ จับเวลา ดูเฉลย และสะสมคะแนนสูงสุด</p>

      <label for="subjectSelect">เลือกหมวดวิชา</label>
      <select id="subjectSelect" onchange="showBestScore()">
        <option value="all">รวมทุกวิชา</option>
        <option value="คณิตศาสตร์">คณิตศาสตร์ — 30 ข้อ</option>
        <option value="วิทยาศาสตร์">วิทยาศาสตร์ — 30 ข้อ</option>
        <option value="ภาษาไทย">ภาษาไทย — 30 ข้อ</option>
        <option value="ภาษาอังกฤษ">ภาษาอังกฤษ — 30 ข้อ</option>
        <option value="การคิดวิเคราะห์">การคิดวิเคราะห์ — 30 ข้อ</option>
        <option value="สังคมศึกษา">สังคมศึกษา — 10 ข้อ</option>
      </select>

      <label for="difficultySelect">เลือกระดับความยาก</label>
      <select id="difficultySelect" onchange="showBestScore()">
        <option value="easy">ง่าย — 20 วินาทีต่อข้อ</option>
        <option value="medium">ปานกลาง — 15 วินาทีต่อข้อ</option>
        <option value="hard" selected>ยาก — 10 วินาทีต่อข้อ</option>
      </select>

      <div class="best" id="bestOnStart">คะแนนสูงสุด: ยังไม่มี</div>
      <button class="primary" onclick="startGame()">เริ่มเล่น</button>
      <p class="muted">
        ตอบถูกข้อละ 1 คะแนน คะแนนสูงสุดเก็บไว้ในเบราว์เซอร์เครื่องนี้
      </p>
    </section>

    <section id="quizScreen" class="hidden">
      <button class="back-button" onclick="backToStart()">← ย้อนกลับ</button>

      <div class="topline">
        <span id="counter"></span>
        <span id="score"></span>
        <span id="timerText"></span>
      </div>

      <div class="bar"><div class="fill" id="timerFill"></div></div>
      <div class="muted" id="subjectName"></div>
      <div class="question" id="questionText"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button class="primary hidden" id="nextButton" onclick="nextQuestion()">
        ข้อต่อไป
      </button>
    </section>

    <section id="resultScreen" class="hidden">
      <h1>🏆 จบเกมแล้ว!</h1>
      <div id="resultText"></div>
      <div class="best" id="bestAtEnd"></div>
      <button class="primary" onclick="backToStart()">กลับไปเลือกหมวด</button>
      <button class="primary" onclick="startGame()">เล่นอีกครั้ง</button>
    </section>
  </main>

  <script>
    const rawQuestions = {
      "คณิตศาสตร์": [
        ["25 + 17 มีค่าเท่าไร?", ["32", "42", "52", "62"], 1, "25 + 17 = 42"],
        ["100 - 38 มีค่าเท่าไร?", ["52", "62", "68", "72"], 1, "100 - 38 = 62"],
        ["12 × 8 มีค่าเท่าไร?", ["86", "92", "96", "108"], 2, "12 × 8 = 96"],
        ["144 ÷ 12 มีค่าเท่าไร?", ["10", "11", "12", "14"], 2, "144 ÷ 12 = 12"],
        ["3/4 + 1/8 มีค่าเท่าไร?", ["5/8", "6/8", "7/8", "1"], 2, "3/4 = 6/8 ดังนั้นผลรวมคือ 7/8"],
        ["5/6 - 1/3 มีค่าเท่าไร?", ["1/6", "1/2", "2/3", "5/3"], 1, "1/3 = 2/6 ดังนั้นผลต่างคือ 1/2"],
        ["0.6 เขียนเป็นเศษส่วนอย่างต่ำได้เท่าไร?", ["1/6", "3/5", "2/3", "6/5"], 1, "0.6 = 6/10 = 3/5"],
        ["20% ของ 150 มีค่าเท่าไร?", ["20", "25", "30", "35"], 2, "150 × 20/100 = 30"],
        ["ราคา 80 บาท ลดเหลือ 60 บาท ลดไปกี่เปอร์เซ็นต์?", ["20%", "25%", "30%", "40%"], 1, "ลด 20 บาทจาก 80 บาท คิดเป็น 25%"],
        ["สี่เหลี่ยมผืนผ้ายาว 9 ซม. กว้าง 4 ซม. มีพื้นที่เท่าไร?", ["13", "26", "36", "40"], 2, "พื้นที่ = 9 × 4 = 36 ตารางเซนติเมตร"],
        ["สี่เหลี่ยมจัตุรัสด้านละ 7 ซม. มีเส้นรอบรูปเท่าไร?", ["14", "21", "28", "49"], 2, "เส้นรอบรูป = 4 × 7 = 28 เซนติเมตร"],
        ["สามเหลี่ยมฐาน 10 ซม. สูง 6 ซม. มีพื้นที่เท่าไร?", ["16", "30", "60", "80"], 1, "พื้นที่ = 1/2 × 10 × 6 = 30 ตารางเซนติเมตร"],
        ["วงกลมรัศมี 7 ซม. มีเส้นผ่านศูนย์กลางเท่าไร?", ["7", "14", "21", "28"], 1, "เส้นผ่านศูนย์กลาง = 2 × 7 = 14 เซนติเมตร"],
        ["ค่าเฉลี่ยของ 4, 6, 8 และ 10 คือเท่าไร?", ["6", "7", "8", "9"], 1, "ผลรวม 28 หารด้วย 4 เท่ากับ 7"],
        ["อัตราส่วน 2:3 มีผลรวมของจำนวนส่วนเท่าไร?", ["1", "5", "6", "9"], 1, "2 + 3 = 5"],
        ["1.5 เมตร เท่ากับกี่เซนติเมตร?", ["15", "105", "150", "1,500"], 2, "1.5 × 100 = 150 เซนติเมตร"],
        ["2.5 กิโลกรัม เท่ากับกี่กรัม?", ["25", "250", "2,500", "25,000"], 2, "2.5 × 1,000 = 2,500 กรัม"],
        ["ถ้า x + 9 = 15 แล้ว x เท่ากับเท่าไร?", ["4", "5", "6", "7"], 2, "x = 15 - 9 = 6"],
        ["ถ้า 3x = 21 แล้ว x เท่ากับเท่าไร?", ["6", "7", "8", "9"], 1, "x = 21 ÷ 3 = 7"],
        ["จำนวนถัดไปของ 5, 10, 15, 20 คืออะไร?", ["22", "24", "25", "30"], 2, "เพิ่มครั้งละ 5 จึงได้ 25"],
        ["จำนวนถัดไปของ 2, 4, 8, 16 คืออะไร?", ["18", "24", "30", "32"], 3, "คูณ 2 ทุกครั้ง จึงได้ 32"],
        ["จำนวนใดเป็นจำนวนเฉพาะ?", ["21", "27", "29", "33"], 2, "29 หารลงตัวได้ด้วย 1 และ 29 เท่านั้น"],
        ["ห.ร.ม. ของ 12 และ 18 คือเท่าไร?", ["3", "6", "9", "12"], 1, "ห.ร.ม. ของ 12 และ 18 คือ 6"],
        ["ค.ร.น. ของ 4 และ 6 คือเท่าไร?", ["8", "10", "12", "24"], 2, "ค.ร.น. ของ 4 และ 6 คือ 12"],
        ["1 ชั่วโมง 45 นาที เท่ากับกี่นาที?", ["95", "100", "105", "115"], 2, "60 + 45 = 105 นาที"],
        ["3 โหล เท่ากับกี่ชิ้น?", ["24", "30", "36", "48"], 2, "3 × 12 = 36 ชิ้น"],
        ["มีลูกบอลสีแดง 3 ลูก สีน้ำเงิน 2 ลูก รวมกี่ลูก?", ["4", "5", "6", "8"], 1, "3 + 2 = 5 ลูก"],
        ["จำนวนใดเป็นจำนวนคู่?", ["17", "23", "36", "41"], 2, "36 หารด้วย 2 ลงตัว"],
        ["หนังสือเล่มละ 35 บาท ซื้อ 4 เล่ม ต้องจ่ายเท่าไร?", ["120", "130", "140", "150"], 2, "35 × 4 = 140 บาท"],
        ["มีเงิน 200 บาท ซื้อของราคา 135 บาท เหลือเท่าไร?", ["55", "65", "75", "85"], 1, "200 - 135 = 65 บาท"]
      ],

      "วิทยาศาสตร์": [
        ["พืชใช้แก๊สชนิดใดในการสังเคราะห์ด้วยแสง?", ["ออกซิเจน", "คาร์บอนไดออกไซด์", "ไนโตรเจน", "ฮีเลียม"], 1, "พืชใช้คาร์บอนไดออกไซด์ น้ำ และพลังงานแสง"],
        ["พืชสร้างอาหารได้มากที่บริเวณใด?", ["ราก", "ดอก", "ใบ", "เมล็ด"], 2, "ใบมีคลอโรฟิลล์ช่วยรับพลังงานแสง"],
        ["น้ำแข็งเปลี่ยนเป็นน้ำเรียกว่าอะไร?", ["การระเหย", "การควบแน่น", "การหลอมเหลว", "การแข็งตัว"], 2, "ของแข็งเปลี่ยนเป็นของเหลวเรียกการหลอมเหลว"],
        ["น้ำเดือดที่อุณหภูมิประมาณเท่าไรในความดันปกติ?", ["0°C", "50°C", "100°C", "200°C"], 2, "น้ำเดือดที่ประมาณ 100°C ในความดันปกติ"],
        ["น้ำแข็งบริสุทธิ์หลอมเหลวที่อุณหภูมิประมาณเท่าไร?", ["0°C", "10°C", "50°C", "100°C"], 0, "น้ำแข็งบริสุทธิ์หลอมเหลวที่ประมาณ 0°C"],
        ["แรงใดดึงวัตถุให้ตกลงสู่พื้นโลก?", ["แรงเสียดทาน", "แรงโน้มถ่วง", "แรงแม่เหล็ก", "แรงลอยตัว"], 1, "แรงโน้มถ่วงดึงวัตถุเข้าหาโลก"],
        ["อวัยวะใดสูบฉีดเลือดไปทั่วร่างกาย?", ["ปอด", "หัวใจ", "กระเพาะอาหาร", "ไต"], 1, "หัวใจทำหน้าที่สูบฉีดเลือด"],
        ["อวัยวะใดช่วยแลกเปลี่ยนแก๊สในการหายใจ?", ["ปอด", "ตับ", "ไต", "ลำไส้"], 0, "ปอดแลกเปลี่ยนออกซิเจนและคาร์บอนไดออกไซด์"],
        ["กระดูกมีหน้าที่สำคัญอย่างไร?", ["ย่อยอาหาร", "ค้ำจุนร่างกาย", "สูบฉีดเลือด", "สร้างเสียง"], 1, "กระดูกช่วยค้ำจุนร่างกายและปกป้องอวัยวะ"],
        ["สัตว์ชนิดใดเป็นสัตว์เลี้ยงลูกด้วยนม?", ["กบ", "ปลาทอง", "ค้างคาว", "เต่า"], 2, "ค้างคาวเลี้ยงลูกด้วยน้ำนม"],
        ["สัตว์ชนิดใดหายใจด้วยเหงือก?", ["ปลา", "แมว", "นก", "งู"], 0, "ปลาใช้เหงือกแลกเปลี่ยนแก๊สในน้ำ"],
        ["ส่วนใดของพืชดูดน้ำและแร่ธาตุ?", ["ดอก", "ใบ", "ราก", "ผล"], 2, "รากดูดน้ำและแร่ธาตุจากดิน"],
        ["โลกหมุนรอบตัวเองทำให้เกิดอะไร?", ["ฤดูกาล", "กลางวันและกลางคืน", "ข้างขึ้นข้างแรม", "สุริยุปราคา"], 1, "โลกหมุนรอบตัวเองทำให้เกิดกลางวันและกลางคืน"],
        ["โลกโคจรรอบสิ่งใด?", ["ดวงจันทร์", "ดาวอังคาร", "ดวงอาทิตย์", "ดาวพฤหัสบดี"], 2, "โลกโคจรรอบดวงอาทิตย์"],
        ["ดวงจันทร์ได้รับแสงสว่างจากที่ใด?", ["สร้างแสงเอง", "สะท้อนแสงจากดวงอาทิตย์", "แสงจากโลก", "แสงจากดาวอื่น"], 1, "ดวงจันทร์สะท้อนแสงจากดวงอาทิตย์"],
        ["วัสดุใดถูกแม่เหล็กดูดได้?", ["ไม้", "พลาสติก", "เหล็ก", "กระดาษ"], 2, "เหล็กเป็นวัสดุที่ถูกแม่เหล็กดูดได้"],
        ["เสียงเดินทางผ่านสิ่งใดได้?", ["สุญญากาศเท่านั้น", "ตัวกลาง เช่น อากาศหรือน้ำ", "แสงเท่านั้น", "ไม่มีตัวกลาง"], 1, "เสียงต้องอาศัยตัวกลางในการเดินทาง"],
        ["พลังงานจากดวงอาทิตย์จัดเป็นพลังงานชนิดใด?", ["พลังงานแสง", "พลังงานเสียง", "พลังงานเคมีเท่านั้น", "พลังงานแม่เหล็ก"], 0, "ดวงอาทิตย์ให้พลังงานแสงและความร้อน"],
        ["ข้อใดเป็นแหล่งพลังงานหมุนเวียน?", ["ถ่านหิน", "น้ำมัน", "ลม", "ก๊าซธรรมชาติ"], 2, "พลังงานลมเป็นพลังงานหมุนเวียน"],
        ["การระเหยเปลี่ยนสถานะจากอะไรเป็นอะไร?", ["ของแข็งเป็นของเหลว", "ของเหลวเป็นแก๊ส", "แก๊สเป็นของเหลว", "ของเหลวเป็นของแข็ง"], 1, "การระเหยคือของเหลวเปลี่ยนเป็นแก๊ส"],
        ["ไอน้ำเย็นตัวเป็นหยดน้ำเรียกว่าอะไร?", ["การหลอมเหลว", "การระเหย", "การควบแน่น", "การแข็งตัว"], 2, "แก๊สเปลี่ยนเป็นของเหลวเรียกการควบแน่น"],
        ["น้ำบริสุทธิ์มีสูตรเคมีใด?", ["CO₂", "O₂", "H₂O", "NaCl"], 2, "สูตรเคมีของน้ำคือ H₂O"],
        ["แก๊สใดจำเป็นต่อการหายใจของมนุษย์?", ["ออกซิเจน", "ฮีเลียม", "มีเทน", "ไฮโดรเจน"], 0, "มนุษย์ใช้ออกซิเจนในการหายใจ"],
        ["อาหารกลุ่มใดเป็นแหล่งพลังงานหลักของร่างกาย?", ["คาร์โบไฮเดรต", "วิตามิน", "น้ำ", "เกลือแร่"], 0, "คาร์โบไฮเดรตเป็นแหล่งพลังงานสำคัญ"],
        ["วิตามินชนิดใดร่างกายสร้างได้เมื่อได้รับแสงแดด?", ["วิตามิน A", "วิตามิน B₁₂", "วิตามิน C", "วิตามิน D"], 3, "ผิวหนังสร้างวิตามิน D ได้เมื่อได้รับแสงแดด"],

        ["ข้อใดไม่ใช่การส่งเสริมภูมิปัญญาไทย?", ["จัดตั้งกองทุนส่งเสริม", "ปล่อยให้เป็นไปตามธรรมชาติ", "จัดศูนย์การเรียนรู้", "ยกย่องครูภูมิปัญญาไทย"], 1, "การปล่อยปละละเลยไม่ใช่การส่งเสริมภูมิปัญญา"],
        ["ภูมิปัญญาท้องถิ่นข้อใดเกี่ยวข้องกับประเพณีไทย?", ["การทอดกฐิน", "การทำฝนเทียม", "การผลิตไบโอดีเซล", "เกษตรผสมผสาน"], 0, "การทอดกฐินเป็นประเพณีที่เกี่ยวข้องกับวัฒนธรรมไทย"],
        ["ใครปฏิบัติตนในการอนุรักษ์ภูมิปัญญาท้องถิ่น?", ["ก้านไปห้างสรรพสินค้า", "กล้วยทำเค้กแจกเพื่อนบ้าน", "กิ่งสวมชุดผ้าไหมไทยทุกวันศุกร์", "ก้อนซื้อกระเป๋าต่างประเทศมาขาย"], 2, "การใช้และสนับสนุนผ้าไหมไทยเป็นแนวทางอนุรักษ์ภูมิปัญญา"],
        ["ข้อใดเป็นตัวอย่างของภูมิปัญญาท้องถิ่น?", ["รถเกี่ยวข้าว", "เครื่องตัดหญ้า", "เครื่องกระจายเสียง", "ลูกประคบสมุนไพร"], 3, "ลูกประคบสมุนไพรนำความรู้พื้นบ้านมาใช้ดูแลสุขภาพ"],
        ["ข้อใดไม่ใช่ลักษณะของภูมิปัญญาท้องถิ่น?", ["สร้างสรรค์โดยคนในท้องถิ่น", "ใช้ได้จริงเฉพาะในอดีตเท่านั้น", "มีประโยชน์ต่อการดำรงชีวิต", "ตอบสนองความต้องการของชุมชน"], 1, "ภูมิปัญญาท้องถิ่นสามารถปรับใช้ในปัจจุบันได้ ไม่ได้จำกัดเฉพาะอดีต"]
      ]
    };

    const questionBank = Object.entries(rawQuestions).flatMap(
      ([subject, rows]) =>
        rows.map(([text, choices, answer, explain]) => ({
          subject, text, choices, answer, explain
        }))
    );

    let questions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let timePerQuestion = 10;
    let timeLeft = 10;
    let mixedQuestionCount = 30;
    let timerId = null;
    let locked = false;
    let selectedMode = "all";
    let selectedDifficulty = "hard";

    function showScreen(screenId) {
      document.querySelectorAll("main section").forEach(section => {
        section.classList.add("hidden");
      });
      document.getElementById(screenId).classList.remove("hidden");
    }

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function getStorageKey(mode, difficulty) {
      return `m1-best-points-${mode}-${difficulty}`;
    }

    function getBestScore(mode, difficulty) {
      try {
        return Number(localStorage.getItem(getStorageKey(mode, difficulty))) || 0;
      } catch {
        return 0;
      }
    }

    function showBestScore() {
      const mode = document.getElementById("subjectSelect").value;
      const difficulty = document.getElementById("difficultySelect").value;
      const best = getBestScore(mode, difficulty);

      document.getElementById("bestOnStart").textContent =
        best > 0 ? `คะแนนสูงสุด: ${best} คะแนน` : "คะแนนสูงสุด: ยังไม่มี";
    }

    function startGame() {
      clearInterval(timerId);

      selectedMode = document.getElementById("subjectSelect").value;
      selectedDifficulty = document.getElementById("difficultySelect").value;

      if (selectedDifficulty === "easy") {
        timePerQuestion = 20;
        mixedQuestionCount = 10;
      } else if (selectedDifficulty === "medium") {
        timePerQuestion = 15;
        mixedQuestionCount = 20;
      } else {
        timePerQuestion = 10;
        mixedQuestionCount = 30;
      }

      const pool = selectedMode === "all"
        ? questionBank
        : questionBank.filter(question => question.subject === selectedMode);

      questions = selectedMode === "all"
        ? shuffle(pool).slice(0, mixedQuestionCount)
        : shuffle(pool);

      currentIndex = 0;
      correctCount = 0;
      showScreen("quizScreen");
      renderQuestion();
    }

    function renderQuestion() {
      locked = false;
      timeLeft = timePerQuestion;

      const question = questions[currentIndex];

      document.getElementById("counter").textContent =
        `ข้อ ${currentIndex + 1} / ${questions.length}`;
      document.getElementById("score").textContent =
        `คะแนน ${correctCount}`;
      document.getElementById("timerText").textContent =
        `เวลา ${timeLeft} วินาที`;
      document.getElementById("subjectName").textContent =
        `${question.subject} · ข้อละ 1 คะแนน`;
      document.getElementById("questionText").textContent = question.text;
      document.getElementById("feedback").textContent = "";
      document.getElementById("nextButton").classList.add("hidden");

      const timerFill = document.getElementById("timerFill");
      timerFill.style.width = "100%";
      timerFill.classList.remove("low");

      const options = document.getElementById("options");
      options.innerHTML = "";

      question.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = `${["ก", "ข", "ค", "ง"][index]}. ${choice}`;
        button.onclick = () => answerQuestion(index);
        options.appendChild(button);
      });

      clearInterval(timerId);
      timerId = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      if (locked) return;

      timeLeft--;
      document.getElementById("timerText").textContent =
        `เวลา ${timeLeft} วินาที`;

      const timerFill = document.getElementById("timerFill");
      timerFill.style.width =
        `${Math.max(0, (timeLeft / timePerQuestion) * 100)}%`;

      if (timeLeft <= 5) timerFill.classList.add("low");
      if (timeLeft <= 0) answerQuestion(null);
    }

    function answerQuestion(selectedIndex) {
      if (locked) return;

      locked = true;
      clearInterval(timerId);

      const question = questions[currentIndex];
      const buttons = document.querySelectorAll(".option");

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === question.answer) button.classList.add("correct");
      });

      if (selectedIndex === question.answer) {
        correctCount++;
        document.getElementById("feedback").textContent =
          `ถูกต้อง! ได้ 1 คะแนน — ${question.explain}`;
      } else if (selectedIndex === null) {
        document.getElementById("feedback").textContent =
          `หมดเวลา! คำตอบที่ถูกคือ ${["ก", "ข", "ค", "ง"][question.answer]} — ${question.explain}`;
      } else {
        buttons[selectedIndex].classList.add("wrong");
        document.getElementById("feedback").textContent =
          `ยังไม่ถูก คำตอบที่ถูกคือ ${["ก", "ข", "ค", "ง"][question.answer]} — ${question.explain}`;
      }

      document.getElementById("score").textContent =
        `คะแนน ${correctCount}`;

      const nextButton = document.getElementById("nextButton");
      nextButton.textContent =
        currentIndex === questions.length - 1 ? "ดูผลคะแนน" : "ข้อต่อไป";
      nextButton.classList.remove("hidden");
    }

    function nextQuestion() {
      currentIndex++;

      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        finishGame();
      }
    }

    function finishGame() {
      clearInterval(timerId);

      const newBest = Math.max(
        getBestScore(selectedMode, selectedDifficulty),
        correctCount
      );

      try {
        localStorage.setItem(
          getStorageKey(selectedMode, selectedDifficulty),
          String(newBest)
        );
      } catch {
        // เกมยังแสดงผลได้ แม้เบราว์เซอร์ปิดการบันทึกข้อมูล
      }

      document.getElementById("resultText").innerHTML =
        `<p>ได้ <strong>${correctCount} คะแนน</strong> จาก ${questions.length} คะแนน</p>
         <p>ตอบถูกข้อละ 1 คะแนน</p>`;

      document.getElementById("bestAtEnd").textContent =
        `คะแนนสูงสุดของหมวดและระดับนี้: ${newBest} คะแนน`;

      showScreen("resultScreen");

      if (typeof saveTestScore === "function") {
        saveTestScore(correctCount);
      }
    }

    function backToStart() {
      clearInterval(timerId);
      showScreen("startScreen");
      showBestScore();
    }

    showBestScore();
  </script>

  <!-- Firebase SDK: ใช้กรณีต้องการบันทึกคะแนนออนไลน์ -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "ใส่_API_KEY_จริงจาก Firebase",
      authDomain: "skilldragonyok.firebaseapp.com",
      projectId: "skilldragonyok",
      storageBucket: "skilldragonyok.firebasestorage.app",
      messagingSenderId: "894981973450",
      appId: "1:894981973450:web:39d6f4c2170e774c1d1b33"
    };

    let db = null;

    try {
      if (firebaseConfig.apiKey !== "ใส่_API_KEY_จริงจาก Firebase") {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
      }
    } catch (error) {
      console.warn("Firebase ยังไม่ได้ตั้งค่า:", error);
    }

    async function saveTestScore(finalScore) {
      if (!db || !firebase.auth().currentUser) {
        console.warn("ไม่ได้บันทึกคะแนนออนไลน์: Firebase ยังไม่พร้อมหรือผู้เล่นยังไม่ได้เข้าสู่ระบบ");
        return;
      }

      if (finalScore <= 0) return;

      const user = firebase.auth().currentUser;
      const gameId = "test";
      const userRef = db.collection("users").doc(user.uid);

      try {
        await db.runTransaction(async transaction => {
          const doc = await transaction.get(userRef);
          if (!doc.exists) return;

          const data = doc.data();
          const games = data.games || {};
          const current = games[gameId] || { total: 0, best: 0, plays: 0 };

          transaction.update(userRef, {
            totalScore: firebase.firestore.FieldValue.increment(finalScore),
            [`games.${gameId}`]: {
              total: (current.total || 0) + finalScore,
              best: Math.max(current.best || 0, finalScore),
              plays: (current.plays || 0) + 1,
              lastPlayed: new Date()
            }
          });
        });

        console.log("บันทึกคะแนนสอบเข้า ม.1 สำเร็จ:", finalScore);
      } catch (error) {
        console.error("บันทึกคะแนนไม่สำเร็จ:", error);
      }
    }
  </script>
